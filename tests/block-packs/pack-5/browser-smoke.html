<!doctype html><html lang="en"><meta charset="utf-8"><title>Pack 5 isolated WebGL2 physical-fixture smoke test</title>
<style>body{font:16px sans-serif;margin:1rem;background:#17242c;color:#e7e6de}canvas{width:320px;height:160px;max-width:90vw;border:1px solid #657}</style>
<h1>Pack 5 browser foundation — NOT PLAYABLE</h1><p id="result">RUNNING</p><canvas id="test" width="320" height="160"></canvas>
<script type="module">
import {makePack5Fixture} from '../../../src/block-packs/pack-5/fixture.mjs';
const out=document.getElementById('result');
try{
 const gl=document.getElementById('test').getContext('webgl2',{antialias:false});
 if(!gl)throw Error('WebGL2 unavailable');
 gl.clearColor(.09,.22,.32,1);gl.clear(gl.COLOR_BUFFER_BIT);
 const rgba=new Uint8Array(4);gl.readPixels(4,4,1,1,gl.RGBA,gl.UNSIGNED_BYTE,rgba);
 if(rgba[0]===0&&rgba[1]===0&&rgba[2]===0)throw Error('WebGL2 clear/readPixels failed');
 const d={symbolicId:'pack5:092',name:'Fixture-only rug',attachment:'floor',parts:[{cell:[0,0,0],boxes:[[0,.02,0,1,.04,1]],collisionBoxes:[]}]};
 const f=makePack5Fixture([d]);f.setSupport([0,-1,0]);if(!f.place('pack5:092',[0,0,0]).ok)throw Error('Place failed');
 if(!f.raycast([.5,1,.5],[0,-1,0])||f.collides([0,0,0,1,1,1]))throw Error('Partial-selection contract failed');
 if(!f.removeRay([.5,1,.5],[0,-1,0])||f.count()!==0)throw Error('Removal failed');
 out.textContent='PASS — real browser WebGL2 + physical fixture, no actual Pack 5 asset rendered';out.dataset.status='PASS';
}catch(e){out.textContent='FAIL — '+String(e);out.dataset.status='FAIL';}
</script></html>
