name: Roadmap A original R3 source player 2430-ray authentic normalization R2
on:
  push:
    branches:
      - roadmap-a-pack5-r3-gpu-f32-normalized-r2-native-20261122
    paths:
      - '.github/workflows/roadmap-a-pack5-r3-gpu-f32-normalized-r2-native.yml'
permissions:
  contents: read
jobs:
  exact-original-selection-and-render-world-float32:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Changed independent original slab normalization and native test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-pack5-exact-r3-edge-precision-autopsy.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-pack5-exact-r3-edge-precision-autopsy.test.mjs
      - name: Only eleven exact R3 full 2430-player-ray native cases
        run: node --test tests/building-pool/roadmap-2a/roadmap-a-pack5-exact-r3-edge-precision-autopsy.test.mjs
