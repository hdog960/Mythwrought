name: Desert Phase 2 Strict Grass / Preservation Native Gate (candidate only)
on:
  push:
    branches:
      - dev/desert-v7-grass-cleanup-phase2-20261121
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desert-v7-grass-p2-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-world-non-destructive-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stacked ancestry and narrow source changes
        run: |
          git merge-base --is-ancestor f50778251e38b78f56cc379748435785f0a34385 HEAD
          git diff --name-only f50778251e38b78f56cc379748435785f0a34385 HEAD
          node --check src/manual-biomes/environment-v7.mjs
          node --check tests/desert-grass-shoulder-phase2.test.mjs
      - name: Original V7 grass, tree, cave, historical and staged-cache contracts
        run: |
          node --test tests/desert-grass-shoulder-phase2.test.mjs \
            tests/desert-tree-exclusion-phase1.test.mjs \
            tests/desert-tree-v7-multiseed-census.test.mjs \
            tests/nonblock-environment-profile.test.mjs \
            tests/ci/nonblock-cache-manifest.test.mjs
