name: Desert P3 main release composition native source gate
on:
  push:
    branches:
      - release/desert-p3-clean-main-integration-20261123
    paths:
      - .github/workflows/desert-p3-main-release-gate.yml
permissions:
  contents: read
concurrency:
  group: desert-p3-main-release-gate
  cancel-in-progress: false
jobs:
  exact-original-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2bd0395d3ef163e9fdc491ab5119b1ee80844194
          path: accepted
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact main lineage and strict allowed source file fence
        run: |
          set -euo pipefail
          MAIN=7016e14cd6289f45eaf7fc6a79a362b47996df65
          test "$(git -C accepted rev-parse HEAD)" = 2bd0395d3ef163e9fdc491ab5119b1ee80844194
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate merge-base "$MAIN" HEAD)" = "$MAIN"
          allowed_paths=(
            '.github/workflows/desert-p3-main-release-gate.yml'
            'docs/desert/PHASE3_RELEASE_MAIN_INTEGRATION_20261123.md'
            'index.html'
            'nonblock-stage-assets.json'
            'scripts/ci/manual-biomes-m5-offline-pwa-webgl2.mjs'
            'scripts/ci/manual-v6-live-webgl2.mjs'
            'scripts/ci/desert-p3-release-integration.gate.mjs'
            'src/app-update.mjs'
            'src/main.mjs'
            'src/manual-biomes/desert-bilateral-rgb.mjs'
            'src/manual-biomes/desert-seam-invalidation.mjs'
            'src/manual-biomes/desert-seam-vertex-tint.mjs'
            'src/manual-biomes/environment-v7.mjs'
            'src/manual-biomes/profile-world.mjs'
            'src/voxel.mjs'
            'sw-m5.js'
            'sw-nonblock-stage.js'
            'tests/app-update-browser.mjs'
            'tests/app-update.test.mjs'
            'tests/desert-grass-shoulder-phase2.test.mjs'
            'tests/desert-phase3-plains-shoulder.test.mjs'
            'tests/desert-phase3-triple-junction.test.mjs'
            'tests/desert-tree-exclusion-phase1.test.mjs'
            'tests/unified-offline-atomic-cache.test.mjs'
          )
          while IFS= read -r file; do
            if ! printf '%s\n' "${allowed_paths[@]}" | grep -Fxq "$file"; then
              echo "Unowned release source file: $file" >&2
              exit 1
            fi
          done < <(git -C candidate diff --name-only "$MAIN" HEAD)
          test "$(git -C candidate rev-parse HEAD:src/main.mjs)" = 3768eb68bc2951dd7e6f41490720a9b4c6616a87
          test "$(git -C candidate rev-parse HEAD:src/voxel.mjs)" = a475ba9c195e6dd4bc5a97284dbff5f2c37936a4
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/environment-v7.mjs)" = 7fa5be721d8597baa22df8c45fb9b10536a7c155
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/profile-world.mjs)" = ffad7e10c07e9252bfaaf8381962443ce658abff
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/desert-bilateral-rgb.mjs)" = 5605d19064c216736d69e4422481637989110718
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/desert-seam-vertex-tint.mjs)" = 023bc3bad89cc524c68d675b3ed8e724d3f3fed8
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/desert-seam-invalidation.mjs)" = 5c40d34eadf683613f6746e456e885087d168627
          test "$(git -C candidate rev-parse HEAD:nonblock-stage-assets.json)" = 093fe9077a286a9830d6bbbcf6a452166a534acf
          test ! -e candidate/src/manual-biomes/desert-seam-shader.mjs
          test ! -e candidate/tests/desert-p3-release-integration.test.mjs
          test -f candidate/scripts/ci/desert-p3-release-integration.gate.mjs
          node --check candidate/src/main.mjs
          node --check candidate/src/voxel.mjs
          node --check candidate/scripts/ci/desert-p3-release-integration.gate.mjs
      - name: Verify complete release cache without weakening original offline validation
        run: |
          cd candidate
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node --test tests/ci/nonblock-cache-manifest.test.mjs tests/app-update.test.mjs tests/unified-offline-atomic-cache.test.mjs
      - name: Original accepted gameplay vs new RGB mesh, and genuine Desert safety regressions
        run: |
          cd candidate
          node --test \
            scripts/ci/desert-p3-release-integration.gate.mjs \
            tests/desert-grass-shoulder-phase2.test.mjs \
            tests/desert-phase3-plains-shoulder.test.mjs \
            tests/desert-phase3-triple-junction.test.mjs \
            tests/desert-tree-exclusion-phase1.test.mjs
