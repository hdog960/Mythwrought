name: Unified final random admission and historical upgrade regression
on:
  push:
    branches: [probe/unified-final-admission-20261127]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/main.mjs
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node --test tests/compact-menu.test.mjs tests/creative-integration/random-cave-admission.test.mjs
  eggs:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            egg: chicken
          - shard: 0
            egg: fox
          - shard: 1
            egg: sunskipper
          - shard: 3
            egg: stoneclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
          python3 -m http.server 4174 >/tmp/eggs.log 2>&1 &
          EGG_SHARD=${{ matrix.shard }} EGG_ONLY=${{ matrix.egg }} EGG_SEED_REJECTION_WITNESS=1 node tests/creative-integration/physical-eggs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-egg-${{ matrix.egg }}
          path: artifacts/creative-eggs/
  historical:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c1138b52bc8041c0db12be31b13fe9ab0fb276e0
          path: prior-height
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
          MOB_PREVIOUS_ROOT=prior-height node tests/mob-final-offline-upgrade-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-historical-height-upgrade
          path: artifacts/mob-final-offline/
