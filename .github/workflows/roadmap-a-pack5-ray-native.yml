name: Roadmap A Pack5 source ray edge-diagnostic only
on:
  push:
    branches:
      - roadmap-a-pack5-ray-native-20261122
    paths:
      - '.github/workflows/roadmap-a-pack5-ray-native.yml'
permissions:
  contents: read
jobs:
  original-pack5-ray-edge-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Source-only list of original triangle-vs-AABB disagreement witnesses
        run: |
          node --input-type=module <<'NODE'
          import {auditOriginalPack5AllVariantYawRaySelection} from './src/building-pool/roadmap-2a/roadmap-a-pack5-ray-selection-producer.mjs';
          const r=auditOriginalPack5AllVariantYawRaySelection();
          for(const row of r.originalSourceAlternativeWitnesses){
            const n=row.raySummary.selectionTriangleMismatch;
            if(!n)continue;
            console.log(JSON.stringify({
              symbol:row.symbol,variant:row.explicitPreviewVariant,yaw:row.explicitPreviewYaw,
              mismatch:n,selectionHits:row.raySummary.selectionHits,
              triangleHits:row.raySummary.authoredTriangleHits,
              first:row.firstBoundedWitnesses.filter(x=>x.classification==='AUTHORED_TRIANGLE_VERSUS_SELECTION_RAY_DISAGREEMENT').slice(0,5)
            }));
          }
          NODE
