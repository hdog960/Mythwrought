name: Navigation previous-height installed-shell qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/navigation00/**'
      - 'src/exploration-map.mjs'
      - 'scripts/ci/navigation-production-upgrade.mjs'
      - '.github/workflows/navigation-production-upgrade.yml'
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c1138b52bc8041c0db12be31b13fe9ab0fb276e0
          path: prior-production
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: |
          test "$(git -C prior-production rev-parse HEAD)" = c1138b52bc8041c0db12be31b13fe9ab0fb276e0
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node --check scripts/ci/navigation-production-upgrade.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - run: node scripts/ci/navigation-production-upgrade.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-previous-height-upgrade
          path: artifacts/navigation-upgrade/
          if-no-files-found: warn
