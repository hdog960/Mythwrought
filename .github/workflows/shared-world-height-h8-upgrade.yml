name: Shared height H8 exact production installed-shell upgrade
on:
  push:
    branches: [research/shared-world-height-h1-h2-20261125]
    paths:
      - 'scripts/ci/shared-world-height-production-upgrade.mjs'
      - '.github/workflows/shared-world-height-h8-upgrade.yml'
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a0487e34d9f5d00a49da05c3bf5b6545ff923085
          path: prior-production
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact immutable source and manifest check
        run: |
          test "$(git -C prior-production rev-parse HEAD)" = a0487e34d9f5d00a49da05c3bf5b6545ff923085
          node scripts/ci/build-stage-cache-manifest.mjs --check
          echo 'e24d30d6ee4d5d742262f240c190ba120cec5f642a55f3d9c2a2ab5204ae8077  nonblock-stage-assets.json' | sha256sum -c -
          node --check scripts/ci/shared-world-height-production-upgrade.mjs
      # Unchanged native regression sources: exact prior 28/28 PASS #45687931714.
      # Only the browser qualification harness changed.
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - run: node scripts/ci/shared-world-height-production-upgrade.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-height-h8-installed-upgrade
          path: artifacts/world-height-upgrade/
          if-no-files-found: warn
