name: Enchanted Forest Phase 0-1 Source Audit (isolated)
on:
  push:
    branches:
      - dev/enchanted-forest-overhaul-*
    paths:
      - 'scripts/ci/enchanted-forest-phase1-audit.mjs'
      - 'scripts/ci/enchanted-forest-phase1-edge-audit.mjs'
      - 'tests/manual-biomes/enchanted-forest-phase1.test.mjs'
      - 'src/manual-biomes/environment-v7.mjs'
      - 'src/manual-biomes/profile-world.mjs'
      - '.github/workflows/enchanted-forest-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enchanted-forest-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-module-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print exact checked-out commit
        run: |
          git rev-parse HEAD
          git status --short
      - name: Exact-source syntax checks
        run: |
          node --check scripts/ci/enchanted-forest-phase1-audit.mjs
          node --check scripts/ci/enchanted-forest-phase1-edge-audit.mjs
          node --check src/manual-biomes/environment-v7.mjs
          node --check src/manual-biomes/profile-world.mjs
      - name: Exact witness and biome-safety native regressions
        run: node --test tests/manual-biomes/enchanted-forest-phase1.test.mjs
      - name: Existing generation, save, non-block habitat and streaming regression suites
        run: |
          node --test tests/manual-biomes/profile-world.test.mjs tests/manual-biomes/v6-balanced-biomes.test.mjs tests/nonblock-environment-profile.test.mjs tests/nonblock-environment-streaming.test.mjs tests/nonblock-habitat.test.mjs
      - name: Audit genuine M7 source provenance and deterministic seed samples
        run: node scripts/ci/enchanted-forest-phase1-audit.mjs
      - name: Audit seven seed interiors and actual warped biome-edge transects
        run: node scripts/ci/enchanted-forest-phase1-edge-audit.mjs
      - name: Preserve independent inspectable output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enchanted-forest-phase1-provenance
          path: |
            artifacts/enchanted-forest/phase1-source-audit.json
            artifacts/enchanted-forest/phase1-wide-edge-audit.json
          if-no-files-found: warn
          retention-days: 14
