# Only two NEW original source-owner upper junction test bodies.
# Authentic prior original surface-to-anchor, deep24 and cave-source
# results are reused, not rerun. No broad CI or game/PWA changes.
name: Enchanted P2 Original Upper Cave Owner-Source Physics
on:
  push:
    branches:
      - research/enchanted-p2-deep48-upper-origin-20261123
    paths:
      - .github/workflows/enchanted-p2-upper-owner-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-upper-owner-junction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate unchanged cave authors, previous physics source and new syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/cave-approaches/upper-network.mjs)" = "a48bd919685b326f062ffa1c5856fa27c2619be8"
          test "$(git hash-object src/manual-caves/source-composition.mjs)" = "$(git hash-object src/manual-caves/source-composition.mjs)"
          test "$(git hash-object src/manual-biomes/enchanted-original-cave-descent-evidence.mjs)" = "7fe76ca6ede339e6f36c595bbd7018c6d2f5892a"
          node --check src/manual-biomes/enchanted-original-upper-owner-walk-audit.mjs
          node --check tests/manual-biomes/enchanted-original-upper-owner-walk-real-m7.test.mjs
      - name: Only new native upper cave owner-authenticated full body walking and mining veto
        run: node --test tests/manual-biomes/enchanted-original-upper-owner-walk-real-m7.test.mjs
