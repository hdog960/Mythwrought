name: Roadmap A Wave22 original nonbank source twelve
on:
  push:
    branches:
      - roadmap-a-wave22-original-387-native-ci-r1-20261124
    paths:
      - '.github/workflows/roadmap-a-wave22-original-387-native-ci-r1.yml'
permissions:
  contents: read
jobs:
  exact-authentic-source-wave22-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact source and native test Git blobs
        run: |
          test "$(git rev-parse HEAD:src/building-pool/roadmap-2a/roadmap-a-wave22.mjs)" = "f21cb9dd127588c4f10fda14cf4071eb938f203f"
          node --check src/building-pool/roadmap-2a/roadmap-a-wave22.mjs
          test "$(git rev-parse HEAD:tests/building-pool/roadmap-2a/roadmap-a-wave22.test.mjs)" = "99b04561e8a7d05fec796c80f59973da9919e6e0"
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave22.test.mjs
          test "$(git rev-parse HEAD:src/building-pool/roadmap-2a/roadmap-a-a5-387-provisional.mjs)" = "05c9b3bdd248cc832ed435fca29078f00d8b5b24"
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-387-provisional.mjs
          test "$(git rev-parse HEAD:tests/building-pool/roadmap-2a/roadmap-a-a5-387-provisional.test.mjs)" = "95b58f818d32a915b43972e858f039323bc82eb9"
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-387-provisional.test.mjs
          test "$(git rev-parse HEAD:tests/building-pool/roadmap-2a/roadmap-a-wave22-protected-128-only-d4.test.mjs)" = "df5b494786ef46377fdae26a65ba78011747efa4"
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave22-protected-128-only-d4.test.mjs
      - name: Nine focused original native tests
        run: node --test tests/building-pool/roadmap-2a/roadmap-a-wave22.test.mjs tests/building-pool/roadmap-2a/roadmap-a-a5-387-provisional.test.mjs tests/building-pool/roadmap-2a/roadmap-a-wave22-protected-128-only-d4.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave22-387-original-source-provenance-r1
          path: artifacts/roadmap-a-a5/A5_SETTLEMENT_HANDOFF_387_PROVISIONAL.json
          if-no-files-found: error
          retention-days: 14
