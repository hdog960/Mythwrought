name: Enchanted Wilds E6 E7 composition landmarks
on:
  push:
    branches: [research/enchanted-wilds-e6-e7-landmarks-20261127]
    paths: [.github/workflows/enchanted-wilds-e6-e7-landmarks.yml]
permissions:
  contents: read
jobs:
  changed-native-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 7b04720b4d8d68209e7e47837fbc71e1d26a9b51
          path: original
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Qualify changed geometry, composition and wilderness placement
        working-directory: candidate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git -C ../original rev-parse HEAD)" = 7b04720b4d8d68209e7e47837fbc71e1d26a9b51
          for f in src/main.mjs src/voxel.mjs src/world-height.mjs src/world-height-stream.mjs src/world-height-budget.mjs src/nonblock/candidate-scene.mjs src/nonblock/candidate-families.mjs; do cmp "$f" "../original/$f"; done
          for f in src/manual-biomes/enchanted-wilds-*.mjs; do node --check "$f"; done
          WILDS_CURRENT_ROOT="$PWD/../original" node --test tests/manual-biomes/enchanted-wilds-e3-e4-families.test.mjs tests/manual-biomes/enchanted-wilds-e5-floor.test.mjs tests/manual-biomes/enchanted-wilds-e5-scenery.test.mjs tests/manual-biomes/enchanted-wilds-e6-e7-landmarks.test.mjs
  focused-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Six changed or previously obscured original-renderer specimens
        run: |
          set -euo pipefail
          git rev-parse HEAD
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/wilds-refined-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node scripts/ci/enchanted-wilds-refined-family-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wilds-refined-original-renderer
          path: artifacts/wilds-refined-visual
