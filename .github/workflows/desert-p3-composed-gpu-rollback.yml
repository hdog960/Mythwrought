name: Desert P3 real-source composed Pack2 Pack3 Manual14 atomic GPU rollback
on:
  push:
    branches:
      - research/desert-p3-composed-upload-rollback-20261122
    paths:
      - .github/workflows/desert-p3-composed-gpu-rollback.yml
permissions:
  contents: read
concurrency:
  group: desert-p3-composed-gpu-rollback
  cancel-in-progress: false
jobs:
  composed-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2d6280e0b4189fce56f3244396771c040198ca5
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert original lineage, owned-file-only diff and frozen accepted source blobs
        run: |
          set -euo pipefail
          BASE=d2d6280e0b4189fce56f3244396771c040198ca5
          test "$(git -C baseline rev-parse HEAD)" = "$BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate merge-base "$BASE" HEAD)" = "$BASE"
          unexpected=$(git -C candidate diff --name-only "$BASE" HEAD | grep -Ev '^(tests/desert-p3-composed-gpu-rollback-original.test.mjs|.github/workflows/desert-p3-composed-gpu-rollback.yml|docs/desert/PHASE3_COMPOSED_ATOMIC_GPU_SOURCE_20261122.md)$' || true)
          test -z "$unexpected"
          test "$(git -C candidate rev-parse HEAD:src/main.mjs)" = 3768eb68bc2951dd7e6f41490720a9b4c6616a87
          test "$(git -C candidate rev-parse HEAD:src/voxel.mjs)" = a475ba9c195e6dd4bc5a97284dbff5f2c37936a4
          test "$(git -C candidate rev-parse HEAD:src/gpu-recovery.mjs)" = 422ef73e383bda78ff94607abb858e3c8a57c2d1
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/desert-seam-invalidation.mjs)" = 5c40d34eadf683613f6746e456e885087d168627
          test ! -f candidate/src/manual-biomes/desert-seam-shader.mjs
          node --check candidate/tests/desert-p3-composed-gpu-rollback-original.test.mjs
      - name: Validate original composed-source GPU rollback with same-realm Float32Array fixture
        run: cd candidate && node --test tests/desert-p3-composed-gpu-rollback-original.test.mjs
