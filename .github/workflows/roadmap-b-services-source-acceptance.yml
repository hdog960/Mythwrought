name: MYTHWROUGHT Builder B essential-services source acceptance (draft only)
on:
  pull_request:
    paths:
      - 'src/building-pool/roadmap-b/**'
      - 'tests/building-pool/roadmap-b/**'
      - 'docs/building-pool/roadmap-b/**'
      - '.github/workflows/roadmap-b-services-source-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mythwrought-builder-b-essentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-ownership-and-genuine-webgl2:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exactly the source PR HEAD (not synthetic merge commit)
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BUILDER_B_EXPECTED_HEAD"
          echo "Source exactly $BUILDER_B_EXPECTED_HEAD"
      - name: Execute real immutable-source ownership, roof/portal, and same-category 8-way D4 checks
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-b/ownership-1b.test.mjs \
            tests/building-pool/roadmap-b/builder-bd-1b-freeze.test.mjs \
            tests/building-pool/roadmap-b/builder-b-essentials-wave1.test.mjs \
            tests/building-pool/roadmap-b/builder-b-essentials-wave2.test.mjs \
            tests/building-pool/roadmap-b/builder-b-essentials-wave3.test.mjs \
            tests/building-pool/roadmap-b/builder-b-essentials-wave4.test.mjs \
            tests/building-pool/roadmap-b/builder-b-glass-rib-spacing.test.mjs \
            tests/building-pool/roadmap-b/builder-b-preview-wiring.test.mjs \
            tests/building-pool/roadmap-b/builder-b-essentials-wave5.test.mjs \
            tests/building-pool/roadmap-b/builder-b-essentials-wave6.test.mjs
      - name: Install exact pinned standalone visual audit dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Capture 12 real Chromium source-specific WebGL2 frames
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/builder-b-essentials-gallery.mjs
      - name: Independently decode, CRC/SHA, verify identities/frames and exact source HEAD
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/audit-builder-b-essentials-gallery.mjs
      - name: Capture six additional source-specific Sedgewatch Chromium WebGL2 frames
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/builder-b-essentials-wave3-gallery.mjs
      - name: Independently validate all six Sedgewatch CRC/SHA identity/viewport and exact HEAD
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/audit-builder-b-essentials-wave3-gallery.mjs
      - name: Capture genuine original Meadowstep stable three-size WebGL2 exterior and cutaway source frames
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/builder-b-essentials-wave4-gallery.mjs
      - name: Independently verify all six Meadowstep PNGs with CRC SHA and exact-head source identity
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/audit-builder-b-essentials-wave4-gallery.mjs
      - name: Capture six original Sunshard desert bathhouse real Chromium source geometry frames
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/builder-b-essentials-wave5-gallery.mjs
      - name: Independently validate six Sunshard source PNGs, decode CRC, SHA and exact original checkout
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/audit-builder-b-essentials-wave5-gallery.mjs
      - name: Capture six new Tidehollow original source-specific genuine Chromium three-size PNGs
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/builder-b-essentials-wave6-gallery.mjs
      - name: Independently audit Tidehollow exact-head six frame PNG CRC SHA source-geometry provenance
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/audit-builder-b-essentials-wave6-gallery.mjs
      - name: Export draft-only genuine source frames and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-b-essentials-six-originals-36-real-chromium-source-frames
          path: |
            artifacts/builder-b-essentials-two-originals-webgl2/
            artifacts/builder-b-essentials-wave3-sedgewatch-webgl2/
            artifacts/builder-b-essentials-wave4-meadowstep-webgl2/
            artifacts/builder-b-essentials-wave5-sunshard-webgl2/
            artifacts/builder-b-essentials-wave6-tidehollow-webgl2/
          if-no-files-found: ignore
