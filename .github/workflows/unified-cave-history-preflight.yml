name: Unified historical cave history preflight only
on:
  push:
    branches: [probe/unified-cave-history-preflight-20261127]
permissions:
  contents: read
jobs:
  cave-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Changed main syntax and complete cache manifest
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check tests/creative-integration/cave-history-persistence-preflight.test.mjs
          node --check src/manual-caves/opt-in-runtime.mjs
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node --check src/main.mjs
          # Existing 30 native cave tests qualified at 70ca7a6; their runtime inputs are unchanged.
          # The newly changed main integration is exercised by the actual UI job below.
  cave-history-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Original game historical cave history only
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
          node --check src/main.mjs
          python3 -m http.server 4174 >/tmp/cave-history-http.log 2>&1 &
          site_server=$!
          trap 'kill "$site_server" 2>/dev/null || true' EXIT
          node tests/creative-integration/historical-cave-history-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-historical-cave-history
          path: artifacts/historical-cave-history/
          if-no-files-found: warn
