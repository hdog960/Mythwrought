name: Unified historical cave history preflight only
on:
  push:
    branches: [probe/unified-cave-history-preflight-20261127]
permissions:
  contents: read
jobs:
  cave-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Actual historical profile persistence and history preflight
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check tests/creative-integration/cave-history-persistence-preflight.test.mjs
          node --check src/manual-caves/opt-in-runtime.mjs
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node --test tests/creative-integration/cave-history-persistence-preflight.test.mjs tests/cave-roadmap-runtime.test.mjs tests/cave-roadmap-profile-store.test.mjs tests/cave-roadmap-game-startup.test.mjs tests/cave-roadmap-world-profile.test.mjs
