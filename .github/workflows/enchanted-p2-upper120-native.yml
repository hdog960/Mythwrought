# Source-only changed original upper-network extension to 40-120 steps.
# Preserve original floor, AIR, AABB, player edits, generator and save.
name: Enchanted P2 Original Upper Network 40-120 Step Physics
on:
  push:
    branches:
      - research/enchanted-p2-deep-band-chamber-upper-20261123
    paths:
      - .github/workflows/enchanted-p2-upper120-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-upper40-120-authored-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard original source and syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/cave-approaches/upper-network.mjs)" = "a48bd919685b326f062ffa1c5856fa27c2619be8"
          test "$(git hash-object src/deep-cave-network.mjs)" = "3c0d2e2ced0ed23a9991da521639e0a4068fb846"
          test "$(git hash-object src/manual-biomes/enchanted-original-cave-descent-evidence.mjs)" = "7fe76ca6ede339e6f36c595bbd7018c6d2f5892a"
          node --check src/manual-biomes/enchanted-original-upper-owner-walk-audit.mjs
          node --check tests/manual-biomes/enchanted-original-upper40-fullroute-real-m7.test.mjs
      - name: Only new 40-step original upper physics, 120-step survey and mining rejection
        run: node --test tests/manual-biomes/enchanted-original-upper40-fullroute-real-m7.test.mjs
