name: Shared world height H1 H2 native
on:
  push:
    branches: [research/shared-world-height-h1-h2-20261125]
    paths:
      - 'tests/shared-world-height-h1-h2.test.mjs'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --test tests/shared-world-height-h1-h2.test.mjs
