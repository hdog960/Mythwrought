name: Living Underworld completion 3 - shared native mesh snapshot
on:
  push:
    branches:
      - dev/living-underworld-phase42-streaming-ownership-20261125
    paths:
      - .github/workflows/living-underworld-phase42-native.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact native shared snapshot and mesh parity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          node --test tests/living-underworld-shared-native-mesh-snapshot.test.mjs > "$RUNNER_TEMP/phase42.tap" 2>&1
          code=$?
          cat "$RUNNER_TEMP/phase42.tap"
          test -z "$(git status --porcelain --untracked-files=all)" || exit 4
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase42-native-shared-mesh-snapshot
          path: ${{ runner.temp }}/phase42.tap
          retention-days: 7
