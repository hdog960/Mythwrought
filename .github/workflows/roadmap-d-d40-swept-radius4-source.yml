name: Builder D40 original bounded radius-four physically swept wall routes only
on:
  push:
    branches:
      - builder-d-d40-swept-radius4-wall-routing-isolated-20261123
    paths:
      - 'src/building-pool/roadmap-d/d40-*'
      - 'tests/building-pool/roadmap-d/d40-*'
      - 'docs/building-pool/roadmap-d/D40_*'
      - '.github/workflows/roadmap-d-d40-swept-radius4-source.yml'
permissions:
  contents: read
concurrency:
  group: builder-d-d40-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  only-d40-original-source-swept-physical-clearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Confirm exact D39 parent and genuine original building/owner/physics SHA
        env:
          CHECKED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKED_HEAD"
          test "$(git rev-parse HEAD^)" = '9deb6fdd9bb4945315f7ae1abb52dd2906d62910'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave16.mjs)" = 'da58c75008bbc286d2512ac8c47ee6b44b6f822d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave17.mjs)" = 'efa2763a2ad40fe2df5179c1138b3e56732b3031'
          test "$(git rev-parse HEAD:src/block-packs/pack-2/definitions.mjs)" = 'f9583417467c991674e5a1bd8c14b9b2816a58f9'
          test "$(git rev-parse HEAD:src/voxel.mjs)" = 'beaa7c9de60e6326128357c9dd3a498a154f255a'
          test "$(git rev-parse HEAD:src/voxel-shape-fit.mjs)" = 'ec5adc274d8b45c91d3dade81c3d9c2830380849'
          test "$(git rev-parse HEAD:src/voxel-shape-interactions.mjs)" = '01be82e6c308e47a35fa6588cc6ed1ebeafca307'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d39-actual-multicourse-wall-loop.mjs)" = '605870b7c1dcbc2f7a52213648eb444c04ce5b30'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d39-original-uncertified-wall-loop-audit.mjs)" = '5dbfbb99d82fd8b930155a9ba5672581ed433b99'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check only four newly added D40 modules and tests
        run: |
          node --check src/building-pool/roadmap-d/d40-swept-exterior-capture.mjs
          node --check src/building-pool/roadmap-d/d40-original-swept-route-audit.mjs
          node --check tests/building-pool/roadmap-d/d40-swept-capture.pure.test.mjs
          node --check tests/building-pool/roadmap-d/d40-original-swept-r4.source.test.mjs
      - name: Run ONLY D40 four pure plus two genuine original W16 and W17 source tests
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-d/d40-swept-capture.pure.test.mjs \
            tests/building-pool/roadmap-d/d40-original-swept-r4.source.test.mjs
