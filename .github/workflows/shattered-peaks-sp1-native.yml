name: Shattered Peaks SP1 targeted native
on:
  push:
    branches: [dev/shattered-peaks-sp0-sp1-20261126]
    paths:
      - 'src/manual-biomes/shattered-peaks-*.mjs'
      - 'tests/shattered-peaks-*.test.mjs'
      - '.github/workflows/shattered-peaks-sp1-native.yml'
permissions:
  contents: read
jobs:
  sp2-vista-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and changed-path vista qualification
        run: |
          git rev-parse HEAD
          node --version
          node --check src/manual-biomes/shattered-peaks-vista.mjs
          node --test tests/shattered-peaks-vista.test.mjs
