name: Living Underworld Phase34 — source-only native failure isolation
on:
  push:
    branches:
      - dev/living-underworld-phase34-native-triplet-ci-20261123
    paths:
      - .github/workflows/living-underworld-phase34-native-only.yml

# One additional focused diagnostic after first exact-head 278/280 native HOLD.
# This is branch-isolated and does NOT repeat all 25 files or 3 M7 scripts.
permissions:
  contents: read

jobs:
  isolate-failed-native-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact isolated checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact native Node v22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Capture full TAP for only four recent original-source research suites
        shell: bash
        run: |
          set +e
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || exit 3
          test -z "$(git status --porcelain --untracked-files=all)" || exit 3
          node --test \
            tests/living-underworld-original-m7-reader-provenance.test.mjs \
            tests/living-underworld-source-cross-audit-ledger.test.mjs \
            tests/living-underworld-m7-triplet-readonly-admission.test.mjs \
            tests/living-underworld-city-grade-separated-underpass.test.mjs \
            > "$RUNNER_TEMP/m7-focused-diagnostic.tap" 2>&1
          code=$?
          echo "EXACT_HEAD=$GITHUB_SHA, native status=$code"
          grep -A 26 -B 4 '^not ok' "$RUNNER_TEMP/m7-focused-diagnostic.tap" || true
          tail -n 20 "$RUNNER_TEMP/m7-focused-diagnostic.tap"
          exit "$code"
      - name: Save complete targeted native TAP even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-underworld-phase34-targeted-diagnostics
          path: ${{ runner.temp }}/m7-focused-diagnostic.tap
          retention-days: 7
          if-no-files-found: warn
