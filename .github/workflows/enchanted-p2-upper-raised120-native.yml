# Original authored upper cave lateral gallery floor OVERLAP source:
# new direct real physics and mining veto, only changed isolated tests.
name: Enchanted P2 Original Upper Step114 Raised Floor and 120 Survey
on:
  push:
    branches:
      - research/enchanted-p2-deep-band-chamber-upper-20261123
    paths:
      - .github/workflows/enchanted-p2-upper-raised120-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-original-owner-raised-floor-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original cave owner and true physics hashes unchanged
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/cave-approaches/upper-network.mjs)" = "a48bd919685b326f062ffa1c5856fa27c2619be8"
          test "$(git hash-object src/deep-cave-network.mjs)" = "3c0d2e2ced0ed23a9991da521639e0a4068fb846"
          node --check src/manual-biomes/enchanted-original-upper-owner-walk-audit.mjs
          node --check tests/manual-biomes/enchanted-original-upper-raised-owner120-real-m7.test.mjs
      - name: Only changed original upper raised author floor full-body physics and veto
        run: node --test tests/manual-biomes/enchanted-original-upper-raised-owner120-real-m7.test.mjs
