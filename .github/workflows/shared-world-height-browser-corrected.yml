name: Shared height original-game browser corrected
on:
  push:
    branches: [research/shared-world-height-h1-h2-20261125]
    paths:
      - 'tests/shared-world-height-browser-corrected.mjs'
      - '.github/workflows/shared-world-height-browser-corrected.yml'
permissions:
  contents: read
jobs:
  original-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - run: |
          python3 -m http.server 4174 >/tmp/height-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node tests/shared-world-height-browser-corrected.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-height-original-webgl-corrected
          path: artifacts/world-height/
          if-no-files-found: ignore
