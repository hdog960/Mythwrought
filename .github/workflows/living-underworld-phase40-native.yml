name: Living Underworld completion 1 - physical gallery build
on:
  push:
    branches:
      - dev/living-underworld-phase40-physical-gallery-build-20261124
    paths:
      - .github/workflows/living-underworld-phase40-native.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact fresh original M7 physical gallery construction
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          node --test tests/living-underworld-physical-gallery-construction.test.mjs > "$RUNNER_TEMP/phase40.tap" 2>&1
          code=$?
          cat "$RUNNER_TEMP/phase40.tap"
          test -z "$(git status --porcelain --untracked-files=all)" || exit 4
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase40-native-physical-gallery-evidence
          path: ${{ runner.temp }}/phase40.tap
          retention-days: 7
