name: Builder D36 original-source wall-socket CSG narrow native only
on:
  push:
    branches:
      - builder-d-d36-wall-transition-socket-isolated-20261122
    paths:
      - 'src/building-pool/roadmap-d/d36-*'
      - 'tests/building-pool/roadmap-d/d36-*'
      - 'docs/building-pool/roadmap-d/D36_*'
      - '.github/workflows/roadmap-d-d36-authentic-wall-socket.yml'
permissions:
  contents: read
concurrency:
  group: builder-d-d36-source-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-original-owner-geometry-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact D35 parent and unchanged historical source owners
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '02f52718ca2dc4b47c646c46609f4716c171e8b4'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave16.mjs)" = 'da58c75008bbc286d2512ac8c47ee6b44b6f822d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave17.mjs)" = 'efa2763a2ad40fe2df5179c1138b3e56732b3031'
          test "$(git rev-parse HEAD:src/block-packs/pack-2/definitions.mjs)" = 'f9583417467c991674e5a1bd8c14b9b2816a58f9'
          test "$(git rev-parse HEAD:src/voxel.mjs)" = 'beaa7c9de60e6326128357c9dd3a498a154f255a'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d35-owner-wall-termination-and-bridge.mjs)" = '17dcde1a58ed6ac3b41d4996da581db9a89c8943'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d35-original-double-lane-connector-audit.mjs)" = 'f4f0a2506dc6a2f12bcf37b02f9506610ee44abe'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check new D36 source and tests only
        run: |
          node --check src/building-pool/roadmap-d/d36-wall-socket-convex-preview.mjs
          node --check src/building-pool/roadmap-d/d36-original-wall-socket-audit.mjs
          node --check tests/building-pool/roadmap-d/d36-socket-preview.pure.test.mjs
          node --check tests/building-pool/roadmap-d/d36-original-wall-socket.source.test.mjs
      - name: ONLY FOUR D36 pure plus TWO D36 original W16-W17 native tests
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-d/d36-socket-preview.pure.test.mjs \
            tests/building-pool/roadmap-d/d36-original-wall-socket.source.test.mjs
