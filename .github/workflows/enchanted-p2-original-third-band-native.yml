# Third depth-band source/physics ONLY; prior accepted 320-step tests reused.
name: Enchanted P2 Original Third Depth Band and -130 Source
on:
  push:
    branches:
      - research/enchanted-p2-third-band-upper-lateral-20261123
    paths:
      - .github/workflows/enchanted-p2-original-third-band-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  third-band-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check unmodified original physics and cave author; changed syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/deep-cave-network.mjs)" = "3c0d2e2ced0ed23a9991da521639e0a4068fb846"
          test "$(git hash-object src/manual-biomes/enchanted-original-cave-descent-evidence.mjs)" = "7fe76ca6ede339e6f36c595bbd7018c6d2f5892a"
          node --check src/manual-biomes/enchanted-original-full-anchor-continuity.mjs
          node --check tests/manual-biomes/enchanted-original-third-band-source-real-m7.test.mjs
      - name: Only new 388-step real walk, third chamber source sweep, mined-floor veto
        run: node --test tests/manual-biomes/enchanted-original-third-band-source-real-m7.test.mjs
