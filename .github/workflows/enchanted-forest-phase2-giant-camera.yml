name: Enchanted Phase 2 Ancient Giant Camera-Locked WebGL2 (draft only)
on:
  push:
    branches:
      - dev/enchanted-forest-overhaul-*
    paths:
      - 'scripts/ci/enchanted-trees-phase2-giant-camera.mjs'
      - '.github/workflows/enchanted-forest-phase2-giant-camera.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enchanted-phase2-giant-camera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-giant-matched-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source, test script syntax and unchanged protected game files
        run: |
          git rev-parse HEAD
          git status --short
          node --check scripts/ci/enchanted-trees-phase2-giant-camera.mjs
          node --check src/manual-biomes/environment-v7.mjs
          node --check src/manual-biomes/enchanted-tree-candidates.mjs
          node --check src/manual-biomes/profile-world.mjs
      - name: Install original browser proof dependencies for one affected viewport
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Compare Ancient Giant at identical physical camera pose in true original-game WebGL2
        run: node scripts/ci/enchanted-trees-phase2-giant-camera.mjs
      - name: Preserve original-engine authentic matched-pose PNG, SHA manifest or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enchanted-phase2-giant-matched-camera-source-evidence
          path: artifacts/enchanted-forest/phase2-giant-camera/
          if-no-files-found: warn
          retention-days: 14
