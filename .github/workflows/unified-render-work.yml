name: Unified exact opaque work reduction and bounded queue experiment
on:
  push:
    branches: [probe/unified-render-work-20261126]
    paths: ['src/**','tests/gpu-frame-admission.test.mjs','tests/terrain-clip-culling.test.mjs','tests/gpu-edit-batch.test.mjs','perf/issue-291/unified-render-work-ab.mjs','.github/workflows/unified-render-work.yml']
permissions:
  contents: read
jobs:
  work-reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact isolated geometry and GPU contracts
        run: |
          test "$(git rev-parse HEAD^)" = b690bf16ae0d4340f920c8300b61f425419875d9
          test "$(git rev-parse HEAD^^)" = f48c42e85c979dd66d8b42db0e8b01dd531b0fe6
          test -z "$(git diff HEAD^ HEAD -- src)"
          node --check src/main.mjs
          node --check perf/issue-291/unified-render-work-ab.mjs
          node --test tests/terrain-clip-culling.test.mjs tests/gpu-frame-admission.test.mjs tests/gpu-edit-batch.test.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7
          npx playwright install chromium
      - name: Original source paired 200 mines, passive cadence and exact pixels
        env:
          AB_VIEWPORT: 956x440
        run: |
          python3 -m http.server 4173 >/tmp/unified-render-work.log 2>&1 &
          node perf/issue-291/unified-render-work-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-render-work
          path: artifacts/unified-render-work/
          if-no-files-found: warn
