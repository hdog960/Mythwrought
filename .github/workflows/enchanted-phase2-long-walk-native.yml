# Research-only targeted native original M7 crossing evidence. The test and
# inspector do not change gameplay, caves, trees, worlds or historic saves.
# Use prior exact-commit source/native/WebGL2 results instead of broad CI.
name: Enchanted Phase 2 Longer M7 Seam Walk (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-long-real-m7-walk-20261123
    paths:
      - .github/workflows/enchanted-phase2-long-walk-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-m7-extended-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate unchanged old source and syntax-check only new research files
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          test "$(git hash-object src/manual-biomes/enchanted-original-standing-diagnostic.mjs)" = "f9c9b7fc300cf9ea3a04d2cf54fecb3ce1ee8fb7"
          test "$(git hash-object src/manual-biomes/enchanted-original-physics-route.mjs)" = "21f368cc0532a124e7d2ba0f3e55548386c2682f"
          node --check src/manual-biomes/enchanted-original-route-evidence.mjs
          node --check tests/manual-biomes/enchanted-original-long-walk-source-real-m7.test.mjs
      - name: Only new real long walk and source provenance test
        run: node --test tests/manual-biomes/enchanted-original-long-walk-source-real-m7.test.mjs
