name: Mountain V8 pinned original writer census and owner rollback
on:
  push:
    branches:
      - mountain-v8-integration-preflight-isolated-20261122
    paths:
      - .github/workflows/mountain-v8-p3-original-writer-entrypoints-focused.yml
permissions:
  contents: read
jobs:
  original-writer-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: isolated
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: current-main
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original source and ten focused native cases
        run: |
          node --version
          git -C isolated rev-parse HEAD
          git -C current-main rev-parse HEAD
          test "$(git -C current-main rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check isolated/tests/mountain-v8-p3-original-writer-entrypoints.test.mjs
          export MYTHWROUGHT_P3_MAIN_ROOT="$GITHUB_WORKSPACE/current-main"
          node --test --test-concurrency=1 isolated/tests/mountain-v8-p3-original-writer-entrypoints.test.mjs
