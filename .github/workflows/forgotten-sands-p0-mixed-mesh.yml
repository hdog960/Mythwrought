name: Forgotten Sands P0 mixed mesh and outer cap search
on:
  push:
    branches: [research/forgotten-sands-p0-mixed-mesh-vistas-20261124]
    paths:
      - 'src/manual-biomes/forgotten-sands-mixed-mesh-audit.mjs'
      - 'src/manual-biomes/forgotten-sands-outer-cap-search.mjs'
      - 'tests/forgotten-sands-mixed-mesh-audit.test.mjs'
      - '.github/workflows/forgotten-sands-p0-mixed-mesh.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node --check src/manual-biomes/forgotten-sands-mixed-mesh-audit.mjs
          node --check src/manual-biomes/forgotten-sands-outer-cap-search.mjs
          node --test tests/forgotten-sands-mixed-mesh-audit.test.mjs
