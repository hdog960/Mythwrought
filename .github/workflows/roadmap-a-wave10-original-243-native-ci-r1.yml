      - roadmap-a-wave10-original-243-native-ci-r1-20261123
    paths:
      - '.github/workflows/roadmap-a-wave10-original-243-native-ci-r1.yml'
permissions:
  contents: read
jobs:
  authentic-original-wave10-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Only Wave10 new original source, provenance and native test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-wave10.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-243-provisional.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave10.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-243-provisional.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave10-protected-128-only-d4.test.mjs
      - name: NINE focused ORIGINAL Wave10 physical source, bank vault, previous 231 identity, new-only historical128 D4
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-wave10.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-a5-243-provisional.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-wave10-protected-128-only-d4.test.mjs
      - uses: actions/upload-artifact@v4
