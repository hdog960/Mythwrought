name: Builder D38 isolated original wall anchor topology and coupon parity ONLY
on:
  push:
    branches:
      - builder-d-d38-wall-anchor-topology-isolated-20261123
    paths:
      - 'src/building-pool/roadmap-d/d38-*'
      - 'tests/building-pool/roadmap-d/d38-*'
      - 'docs/building-pool/roadmap-d/D38_*'
      - '.github/workflows/roadmap-d-d38-original-wall-anchor.yml'
permissions:
  contents: read
concurrency:
  group: builder-d-d38-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  only-new-d38-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Authenticate original D37 parent and protected original owner/source blobs
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '75bdb1fcb03eef7b6dcdd3263235720f2f30be70'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave16.mjs)" = 'da58c75008bbc286d2512ac8c47ee6b44b6f822d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave17.mjs)" = 'efa2763a2ad40fe2df5179c1138b3e56732b3031'
          test "$(git rev-parse HEAD:src/block-packs/pack-2/definitions.mjs)" = 'f9583417467c991674e5a1bd8c14b9b2816a58f9'
          test "$(git rev-parse HEAD:src/voxel.mjs)" = 'beaa7c9de60e6326128357c9dd3a498a154f255a'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d35-owner-wall-termination-and-bridge.mjs)" = '17dcde1a58ed6ac3b41d4996da581db9a89c8943'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d36-wall-socket-convex-preview.mjs)" = 'b5f96c7b0bf6bd7cae14e7fce85ca05c8fdfb0ba'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d37-wall-pullout-fastener-contract.mjs)" = '3a1c59605504cce9f8debeff6c0344a00411bb8d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d37-original-wall-tension-proof-audit.mjs)" = 'a48a84c18fc71b21dfb21713e086ee48728fd54f'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check only four new D38 source and test modules
        run: |
          node --check src/building-pool/roadmap-d/d38-wall-anchor-route-contract.mjs
          node --check src/building-pool/roadmap-d/d38-original-anchor-path-audit.mjs
          node --check tests/building-pool/roadmap-d/d38-wall-anchor-route.pure.test.mjs
          node --check tests/building-pool/roadmap-d/d38-original-wall-anchor.source.test.mjs
      - name: Run ONLY four new pure and two original W16-W17 tests
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-d/d38-wall-anchor-route.pure.test.mjs \
            tests/building-pool/roadmap-d/d38-original-wall-anchor.source.test.mjs
