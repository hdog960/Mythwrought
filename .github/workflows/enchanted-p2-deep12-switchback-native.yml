# Changed-only source-native deep24 extended physics + switchback source
# owner boundary. Previously accepted 3/3 full-anchor tests stay untouched.
name: Enchanted Phase 2 Original Deep12 and Switchback Source Audit
on:
  push:
    branches:
      - research/enchanted-p2-full-authored-anchors-20261123
    paths:
      - .github/workflows/enchanted-p2-deep12-switchback-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep12-and-36-owner-survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original game unchanged and changed source/test syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/deep-cave-network.mjs)" = "3c0d2e2ced0ed23a9991da521639e0a4068fb846"
          test "$(git hash-object src/manual-biomes/enchanted-original-cave-descent-evidence.mjs)" = "7fe76ca6ede339e6f36c595bbd7018c6d2f5892a"
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          node --check src/manual-biomes/enchanted-original-crossowner-network-audit.mjs
          node --check tests/manual-biomes/enchanted-original-deep12-switchback-source-real-m7.test.mjs
      - name: Only three NEW actual old-deep spiral and :36 original-source cases
        run: node --test tests/manual-biomes/enchanted-original-deep12-switchback-source-real-m7.test.mjs
