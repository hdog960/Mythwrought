name: Mountain V8 P3 original CPU mesh preview metadata corrected test
# ONLY 12 narrow original-source tests. First job 45302192917 had 10/12,
# two failures from the new audit's missing fail-closed halo metadata field.
# No broad CI, runtime dispatch, WebGL device, saves, deployment or merges.
on:
  push:
    branches:
      - mountain-v8-integration-preflight-isolated-20261122
    paths:
      - .github/workflows/mountain-v8-p3-atomic-mesh-preview-corrected-focused.yml
permissions:
  contents: read
jobs:
  original-cpu-mesh-staging-metadata:
    if: github.ref == 'refs/heads/mountain-v8-integration-preflight-isolated-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated exact Mountain V8 original source
        uses: actions/checkout@v4
        with:
          path: isolated
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout immutable Desert P3 current-main original source only
        uses: actions/checkout@v4
        with:
          path: current-main
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          fetch-depth: 1
          persist-credentials: false
      - name: Original Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original exact SHAs and only corrected 12-stage/rollback native cases
        run: |
          node --version
          git -C isolated rev-parse HEAD
          git -C current-main rev-parse HEAD
          test "$(git -C current-main rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check isolated/src/manual-biomes/mountain-v8-p3-mesh-batch-rollback-research.mjs
          node --check isolated/tests/mountain-v8-p3-mesh-batch-rollback-research.test.mjs
          export MYTHWROUGHT_P3_MAIN_ROOT="$GITHUB_WORKSPACE/current-main"
          node --test --test-concurrency=1 isolated/tests/mountain-v8-p3-mesh-batch-rollback-research.test.mjs
