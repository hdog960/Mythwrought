name: Forgotten Sands P0 mixed-size span
on:
  push:
    branches: [research/forgotten-sands-p0-browser-worker-20261124]
    paths:
      - 'src/manual-biomes/forgotten-sands-mixed-span.mjs'
      - 'tests/forgotten-sands-mixed-span.test.mjs'
      - '.github/workflows/forgotten-sands-p0-mixed-span.yml'
permissions:
  contents: read
jobs:
  native-mixed-span:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node --check src/manual-biomes/forgotten-sands-mixed-span.mjs
          node --test tests/forgotten-sands-mixed-span.test.mjs
