name: Mountain V8 isolated source epoch + detached mock GPU publication
# ONE focused, native original two-checkout test at workflow creation only.
# No persistent stores, real WebGL, original renderer changes or deployment.
on:
  push:
    branches:
      - mountain-v8-integration-preflight-isolated-20261122
    paths:
      - .github/workflows/mountain-v8-p3-original-epoch-publication-focused.yml
permissions:
  contents: read
jobs:
  original-source-render-epoch:
    if: github.ref == 'refs/heads/mountain-v8-integration-preflight-isolated-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact isolated V8 research source
        uses: actions/checkout@v4
        with:
          path: isolated
          fetch-depth: 1
          persist-credentials: false
      - name: Read immutable production Desert P3 original source
        uses: actions/checkout@v4
        with:
          path: current-main
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          fetch-depth: 1
          persist-credentials: false
      - name: Original Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both SHA checkouts, source syntax and only 12 new epoch tests
        run: |
          node --version
          git -C isolated rev-parse HEAD
          git -C current-main rev-parse HEAD
          test "$(git -C current-main rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check isolated/src/manual-biomes/mountain-v8-p3-source-epoch-projected-publication.mjs
          node --check isolated/tests/mountain-v8-p3-source-epoch-projected-publication.test.mjs
          export MYTHWROUGHT_P3_MAIN_ROOT="$GITHUB_WORKSPACE/current-main"
          node --test --test-concurrency=1 isolated/tests/mountain-v8-p3-source-epoch-projected-publication.test.mjs
