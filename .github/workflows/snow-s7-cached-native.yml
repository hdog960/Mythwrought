name: Snow S7 exact post-Desert cached winter-source native gate
on:
  push:
    branches:
      - research/snow-s7-original-cached-winter-tint-20261123
    paths:
      - '.github/workflows/snow-s7-cached-native.yml'
      - 'src/manual-biomes/snowy-s7-mesh-tint-source-cache.mjs'
      - 'tests/snowy-s7-mesh-tint-source-cache.test.mjs'
      - 'tests/snowy-s7-post-desert-original-m7-cache.test.mjs'
permissions:
  contents: read
concurrency:
  group: snow-s7-native-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-only-winter-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Checkout pinned independent Desert production for native source only
        uses: actions/checkout@v4
        with:
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          path: production-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact HEAD, current production pin and authored syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C production-readonly rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check src/manual-biomes/snowy-s7-mesh-tint-source-cache.mjs
          node --check tests/snowy-s7-mesh-tint-source-cache.test.mjs
          node --check tests/snowy-s7-post-desert-original-m7-cache.test.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Focused synthetic source-guard and bounded cache regressions
        run: node --test tests/snowy-s7-mesh-tint-source-cache.test.mjs
      - name: Genuine pinned Desert original M7 two-seed 16x16 cache and seam
        run: |
          node --test tests/snowy-s7-post-desert-original-m7-cache.test.mjs
          test -z "$(git -C production-readonly status --porcelain)"
