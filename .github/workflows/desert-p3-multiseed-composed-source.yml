name: Desert P3 original multiseed corner and composed resident mesh budget
on:
  push:
    branches:
      - research/desert-p3-multiseed-original-composed-audit-20261122
    paths:
      - .github/workflows/desert-p3-multiseed-composed-source.yml
permissions:
  contents: read
concurrency:
  group: desert-p3-multiseed-composed-source
  cancel-in-progress: false
jobs:
  original-multiseed-and-composed:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 48cd616e3f578be51e30fcb02057c2458491baa1
          path: original
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original accepted-gameplay descendant and exact frozen source files
        run: |
          set -euo pipefail
          BASE=48cd616e3f578be51e30fcb02057c2458491baa1
          test "$(git -C original rev-parse HEAD)" = "$BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate merge-base "$BASE" HEAD)" = "$BASE"
          unexpected=$(git -C candidate diff --name-only "$BASE" HEAD | grep -Ev '^(tests/desert-p3-multiseed-composed-original.test.mjs|.github/workflows/desert-p3-multiseed-composed-source.yml|docs/desert/PHASE3_MULTISEED_COMPOSED_SOURCE_AUDIT_20261122.md)$' || true)
          test -z "$unexpected"
          test "$(git -C candidate rev-parse HEAD:src/main.mjs)" = 3768eb68bc2951dd7e6f41490720a9b4c6616a87
          test "$(git -C candidate rev-parse HEAD:src/voxel.mjs)" = a475ba9c195e6dd4bc5a97284dbff5f2c37936a4
          test "$(git -C candidate rev-parse HEAD:src/gpu-recovery.mjs)" = 422ef73e383bda78ff94607abb858e3c8a57c2d1
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/desert-seam-invalidation.mjs)" = 5c40d34eadf683613f6746e456e885087d168627
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/profile-world.mjs)" = ffad7e10c07e9252bfaaf8381962443ce658abff
          test ! -e candidate/src/manual-biomes/desert-seam-shader.mjs
          node --check candidate/tests/desert-p3-multiseed-composed-original.test.mjs
      - name: Reuse prior 8-seed terrain PASS, test only corrected real composed GPU fixture
        run: |
          set -euo pipefail
          # #45097880727 already authenticated the unchanged 8-seed source
          # climate/cave/diagonal test. No broad re-run on this exact logic.
          test "$(git -C candidate rev-parse HEAD:src/manual-biomes/desert-seam-invalidation.mjs)" = 5c40d34eadf683613f6746e456e885087d168627
          cd candidate
          node --test --test-name-pattern='source-exact composed M7' tests/desert-p3-multiseed-composed-original.test.mjs
