# Targeted ORIGINAL M7, no production cave integration, no broad CI,
# reuse all accepted 12-step/anchor/landmark/border original test results.
name: Enchanted P2 Original Deep24 Spiral24 and First-Chamber Probe
on:
  push:
    branches:
      - research/enchanted-p2-deep48-upper-origin-20261123
    paths:
      - .github/workflows/enchanted-p2-deep24-chamber-gate-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-owned-24-spiral-chamber-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard unchanged original cave generator and physics, check new changed files
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/deep-cave-network.mjs)" = "3c0d2e2ced0ed23a9991da521639e0a4068fb846"
          test "$(git hash-object src/manual-biomes/enchanted-original-cave-descent-evidence.mjs)" = "7fe76ca6ede339e6f36c595bbd7018c6d2f5892a"
          node --check src/manual-biomes/enchanted-original-full-anchor-continuity.mjs
          node --check tests/manual-biomes/enchanted-original-spiral24-chamber-gate-real-m7.test.mjs
      - name: Three NEW original source-physics cases only
        run: node --test tests/manual-biomes/enchanted-original-spiral24-chamber-gate-real-m7.test.mjs
