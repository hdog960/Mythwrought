name: Unified causal GPU queue attribution
on:
  push:
    branches: [probe/unified-gpu-queue-20261126]
    paths: ['perf/issue-291/unified-gpu-queue-attribution.mjs','.github/workflows/unified-gpu-queue.yml']
permissions:
  contents: read
jobs:
  queue-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact source and browser prerequisites
        run: |
          test "$(git rev-parse HEAD^)" = f48c42e85c979dd66d8b42db0e8b01dd531b0fe6
          test -z "$(git diff HEAD^ HEAD -- src index.html styles.css sw-m5.js sw-nonblock-stage.js nonblock-stage-assets.json)"
          node --check perf/issue-291/unified-gpu-queue-attribution.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Actual 48 mining actions with and without prior GPU queue drain
        env:
          AB_VIEWPORT: 956x440
        run: |
          python3 -m http.server 4173 >/tmp/unified-queue.log 2>&1 &
          node perf/issue-291/unified-gpu-queue-attribution.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-gpu-queue-attribution
          path: artifacts/unified-gpu-queue/
          if-no-files-found: warn
