name: Mountain V8 original P3 uplift + horizontal/vertical halo dual-source gate
# One narrowly scoped source-only native test at workflow creation.
# Strict read-only pinned production source and isolated research, no merge/deploy.
on:
  push:
    branches:
      - mountain-v8-integration-preflight-isolated-20261122
    paths:
      - .github/workflows/mountain-v8-p3-uplift-and-halo-dual-source-focused.yml
permissions:
  contents: read
jobs:
  source-original-uplift-halo:
    if: github.ref == 'refs/heads/mountain-v8-integration-preflight-isolated-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Isolated V8 source exact push SHA
        uses: actions/checkout@v4
        with:
          path: isolated
          fetch-depth: 1
          persist-credentials: false
      - name: Pinned immutable production Desert P3 source no main mutation
        uses: actions/checkout@v4
        with:
          path: current-main
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          fetch-depth: 1
          persist-credentials: false
      - name: Original Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHAs and ONLY 11 focused original-source tests
        run: |
          node --version
          git -C isolated rev-parse HEAD
          git -C current-main rev-parse HEAD
          test "$(git -C current-main rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check isolated/src/manual-biomes/mountain-v8-p3-uplift-and-halo-audit.mjs
          node --check isolated/tests/mountain-v8-p3-current-main-uplift-and-halo.test.mjs
          export MYTHWROUGHT_P3_MAIN_ROOT="$GITHUB_WORKSPACE/current-main"
          node --test --test-concurrency=1 isolated/tests/mountain-v8-p3-current-main-uplift-and-halo.test.mjs
