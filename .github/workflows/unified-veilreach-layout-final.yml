name: Unified Veilreach layout current-generator witness
on:
  push:
    branches: [probe/unified-veilreach-layout-final-20261127]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Original full layout and normal current-generation world test
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check tests/layout-browser.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/unified-layout.log 2>&1 &
          node tests/layout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-veilreach-layout
          path: artifacts/
