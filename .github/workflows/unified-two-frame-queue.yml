name: Unified bounded two-frame queue experiment
on:
  push:
    branches: [probe/unified-two-frame-queue-20261126]
    paths: ['src/**','tests/gpu-two-frame-queue.test.mjs','perf/issue-291/unified-two-frame-queue-ab.mjs','.github/workflows/unified-two-frame-queue.yml']
permissions:
  contents: read
jobs:
  two-frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact bounded FIFO contracts and unchanged atomic edits
        run: |
          test "$(git rev-parse HEAD^)" = f48c42e85c979dd66d8b42db0e8b01dd531b0fe6
          node --check src/main.mjs
          node --check perf/issue-291/unified-two-frame-queue-ab.mjs
          node --test tests/gpu-two-frame-queue.test.mjs tests/gpu-edit-batch.test.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7
          npx playwright install chromium
      - name: Actual 200 mines, passive cadence and exact pixels
        env:
          AB_VIEWPORT: 956x440
        run: |
          python3 -m http.server 4173 >/tmp/unified-two-frame.log 2>&1 &
          node perf/issue-291/unified-two-frame-queue-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-two-frame-queue
          path: artifacts/unified-two-frame-queue/
          if-no-files-found: warn
