name: Snow S6 real game WebGL2 winter-tone research comparison
on:
  push:
    branches:
      - research/snow-s6-webgl2-inmemory-winter-preview-isolated-20261123
    paths:
      - '.github/workflows/snow-s6-webgl2-research.yml'
      - 'scripts/ci/snow-s6-original-webgl2-intercept.mjs'
permissions:
  contents: read
concurrency:
  group: snow-s6-webgl2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-game-source-overridden-only-in-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated checkout and source-only browser harness
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/ci/snow-s6-original-webgl2-intercept.mjs
          node --check src/manual-biomes/snowy-s6-winter-tone-proposal.mjs
          test -f src/voxel.mjs
      - name: Install pinned free Chromium WebGL2 and real PNG decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Compare actual full original game and in-memory S6 color candidate at identical real snow camera
        run: |
          python3 -m http.server 4173 >/tmp/snow-s6-real-game.log 2>&1 &
          node scripts/ci/snow-s6-original-webgl2-intercept.mjs
      - name: Publish evidence, never gameplay build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-s6-actual-webgl2-research-${{ github.sha }}
          path: artifacts/snow-s6-original-webgl2/
          if-no-files-found: ignore
          retention-days: 7
