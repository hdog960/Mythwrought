name: Roadmap A Wave09 twelve source buildings corrected fixture and 231 lineage native R2
on:
  push:
    branches:
      - roadmap-a-wave09-original-231-native-ci-r2-20261123
    paths:
      - '.github/workflows/roadmap-a-wave09-original-231-native-ci-r2.yml'
permissions:
  contents: read
jobs:
  original-wave09-source-only-corrected:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Original revised source module and exact unchanged focused test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-wave09.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-231-provisional.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave09.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-231-provisional.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave09-protected-128-only-d4.test.mjs
      - name: Only eight new original Wave09 physical source, old219 preservation and historic128 new-only D4
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-wave09.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-a5-231-provisional.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-wave09-protected-128-only-d4.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave09-231-original-source-provenance-native-r2
          path: artifacts/roadmap-a-a5/A5_SETTLEMENT_HANDOFF_231_PROVISIONAL.json
          if-no-files-found: error
          retention-days: 14
