name: Enchanted Phase 2 Real Engine WebGL2 Comparison (isolated draft)
on:
  push:
    branches:
      - dev/enchanted-forest-overhaul-*
    paths:
      - 'scripts/ci/enchanted-trees-phase2-instrumented-webgl2.mjs'
      - '.github/workflows/enchanted-forest-phase2-real-webgl2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enchanted-phase2-real-webgl2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-disposable-browser-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact checked-out commit, verify prototype source and browser syntax
        run: |
          git rev-parse HEAD
          git status --short
          node --check scripts/ci/enchanted-trees-phase2-instrumented-webgl2.mjs
          node --check src/manual-biomes/enchanted-tree-candidates.mjs
          node --check src/manual-biomes/environment-v7.mjs
          node --check src/manual-biomes/profile-world.mjs
      - name: Check persistent save/generation opt-in remains fail-closed
        run: node --test tests/manual-biomes/enchanted-trees-phase2.test.mjs
      - name: Install pinned original Chromium WebGL2 and PNG proof dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Compare six actual-engine scenes with original and test-only module response
        run: node scripts/ci/enchanted-trees-phase2-instrumented-webgl2.mjs
      - name: Preserve authenticated original renderer PNGs, source and instrumentation SHA and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enchanted-phase2-instrumented-original-engine-webgl2
          path: artifacts/enchanted-forest/phase2-real-webgl2/
          if-no-files-found: warn
          retention-days: 14
