name: Mountain V8 isolated P3 exact-current-main conifer footprint original-source
# Two separate READ-ONLY exact SHA checkouts; DOES NOT merge or modify main.
# Trigger only once at workflow creation, never on code/doc subsequent pushes.
# No original V7 broad tests, deployment, production push, nor approvals.
on:
  push:
    branches:
      - mountain-v8-integration-preflight-isolated-20261122
    paths:
      - .github/workflows/mountain-v8-p3-current-main-conifer-source-focused.yml
permissions:
  contents: read
jobs:
  isolated-current-main-source:
    if: github.ref == 'refs/heads/mountain-v8-integration-preflight-isolated-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Isolated V8 source, exact event HEAD
        uses: actions/checkout@v4
        with:
          path: isolated
          persist-credentials: false
          fetch-depth: 1
      - name: CURRENT original Desert P3 main exact immutable SHA, read-only
        uses: actions/checkout@v4
        with:
          path: current-main
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          persist-credentials: false
          fetch-depth: 1
      - name: Original Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact dual original SHAs and narrowly scoped source-only tests
        run: |
          node --version
          git -C isolated rev-parse HEAD
          git -C current-main rev-parse HEAD
          test "$(git -C current-main rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check isolated/src/manual-biomes/mountain-v8-p3-conifer-footprint-preflight.mjs
          node --check isolated/tests/mountain-v8-p3-current-main-conifer-footprint.test.mjs
          export MYTHWROUGHT_P3_MAIN_ROOT="$GITHUB_WORKSPACE/current-main"
          node --test --test-concurrency=1 isolated/tests/mountain-v8-p3-current-main-conifer-footprint.test.mjs
