name: Mountain V8 full surface streaming and shared shaped renderer
on:
  push:
    branches: [mountain-v8-developer-integration-20261124]
    paths: [.github/workflows/mountain-v8-streamed-shared-browser.yml]
permissions:
  contents: read
jobs:
  streamed-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and browser script syntax
        run: |
          git rev-parse HEAD
          node --check scripts/ci/mountain-v8-streamed-shared-browser.mjs
      - name: Install pinned browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Full real surface and shared physical overlays
        run: node scripts/ci/mountain-v8-streamed-shared-browser.mjs
      - name: Retain actual game captures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mountain-v8-streamed-shared
          path: artifacts/mountain-v8-streamed-shared/
          if-no-files-found: warn
