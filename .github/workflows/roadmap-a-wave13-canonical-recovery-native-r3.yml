name: Roadmap A Wave13 original source twelve and canonical recovery R3
on:
  push:
    branches:
      - roadmap-a-wave13-canonical-recovery-native-r3-20261123
    paths:
      - '.github/workflows/roadmap-a-wave13-canonical-recovery-native-r3.yml'
permissions:
  contents: read
jobs:
  exact-authentic-source-wave13-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify original exact revised source and stronger vault native test Git blobs
        run: |
          test "$(git rev-parse HEAD:src/building-pool/roadmap-2a/roadmap-a-wave13.mjs)" = "766bb0093aa09571a4f276c20ef3ea19420a98cf"
          test "$(git rev-parse HEAD:tests/building-pool/roadmap-2a/roadmap-a-wave13.test.mjs)" = "3565c6bb3df01810b53699fc2c2f071b20016e01"
          test "$(git rev-parse HEAD:src/building-pool/roadmap-2a/roadmap-a-a5-279-provisional.mjs)" = "932cc760507cee5fedc04c3c7f22f0846f32d91f"
          node --check src/building-pool/roadmap-2a/roadmap-a-wave13.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-279-provisional.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave13.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-279-provisional.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave13-protected-128-only-d4.test.mjs
      - name: Nine new original Wave13 source floor vault and 267 record parity and historic128 D4 tests
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-wave13.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-a5-279-provisional.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-wave13-protected-128-only-d4.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave13-279-original-source-provenance-r3
          path: artifacts/roadmap-a-a5/A5_SETTLEMENT_HANDOFF_279_PROVISIONAL.json
          if-no-files-found: error
          retention-days: 14
