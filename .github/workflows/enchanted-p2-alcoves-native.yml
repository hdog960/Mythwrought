name: Enchanted P2 Original Alcoves and Independent Seeds
on:
  push:
    branches:
      - research/enchanted-p2-alcoves-seed-ledger-20261123
    paths:
      - .github/workflows/enchanted-p2-alcoves-native.yml
permissions:
  contents: read
jobs:
  original-alcoves-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original authors and native new research
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/cave-approaches/upper-network.mjs)" = "a48bd919685b326f062ffa1c5856fa27c2619be8"
          test "$(git hash-object src/deep-cave-network.mjs)" = "3c0d2e2ced0ed23a9991da521639e0a4068fb846"
          test "$(git hash-object src/manual-biomes/enchanted-original-upper-owner-walk-audit.mjs)" = "8c2ec9e02c12c80d207f6b77c215677efa45a799"
          node --version
          node --check src/manual-biomes/enchanted-original-upper-alcove-excursion.mjs
          node --test tests/manual-biomes/enchanted-original-upper-alcoves-real-m7.test.mjs
