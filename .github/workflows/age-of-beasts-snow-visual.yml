name: Age of Beasts Snow original-renderer visual evidence
on:
  push:
    branches: [dev/age-of-beasts-ab0-ab1-20261126]
    paths:
      - 'src/mobs/age-of-beasts/snow-models.mjs'
      - 'src/mobs/age-of-beasts/mesh-contract.mjs'
      - 'src/mobs/live-render.mjs'
      - 'tests/mobs/age-of-beasts-snow-browser.mjs'
      - '.github/workflows/age-of-beasts-snow-visual.yml'
permissions:
  contents: read
jobs:
  snow-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
      - run: npx playwright install chromium
      - run: node tests/mobs/age-of-beasts-snow-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: age-of-beasts-snow-renderer-evidence
          path: artifacts/age-of-beasts-snow/
          if-no-files-found: warn
