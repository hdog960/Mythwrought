name: Desert P3 visibility-gated seam tint original-mesh parity only
on:
  push:
    branches:
      - research/desert-p3-vertex-color-seam-20261122
    paths:
      - .github/workflows/desert-p3-vertex-lazy-focused.yml
permissions:
  contents: read
concurrency:
  group: desert-p3-vertex-lazy-focused
  cancel-in-progress: false
jobs:
  exact-mesh-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2bd0395d3ef163e9fdc491ab5119b1ee80844194
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source scope and exact protected ancestor
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = 2bd0395d3ef163e9fdc491ab5119b1ee80844194
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate merge-base 2bd0395d3ef163e9fdc491ab5119b1ee80844194 HEAD)" = 2bd0395d3ef163e9fdc491ab5119b1ee80844194
          unexpected=$(git -C candidate diff --name-only 2bd0395d3ef163e9fdc491ab5119b1ee80844194 HEAD | grep -Ev '^(src/voxel.mjs|src/manual-biomes/desert-seam-vertex-tint.mjs|tests/desert-p3-vertex-seam-source.test.mjs|.github/workflows/desert-p3-vertex-rgb-isolated.yml|.github/workflows/desert-p3-vertex-lazy-focused.yml|docs/desert/PHASE3_VERTEX_RGB_SEAM_CHECKPOINT_20261122.md)$' || true)
          test -z "$unexpected"
          node --check candidate/src/voxel.mjs
      - name: Original V7 exact-mesh color-only checks (NO browser)
        run: node --test candidate/tests/desert-p3-vertex-seam-source.test.mjs
