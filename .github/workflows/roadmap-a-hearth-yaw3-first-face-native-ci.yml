name: Roadmap A Pack5 original hearth yaw3 first-face source volume ownership
on:
  push:
    branches:
      - roadmap-a-hearth-yaw3-first-face-native-ci-20261122
    paths:
      - '.github/workflows/roadmap-a-hearth-yaw3-first-face-native-ci.yml'
permissions:
  contents: read
jobs:
  original-hearth-first-source-face-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Only own-lane new first-face source/test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-face-occlusion-audit.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-face-occlusion-audit.test.mjs
      - name: Only eleven original source strict/nearer face ownership native tests
        run: node --test tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-face-occlusion-audit.test.mjs
