name: Living Underworld Phase37 - original entrance fallback
on:
  push:
    branches:
      - dev/living-underworld-phase37-switchback-safe-fallback-20261124
    paths:
      - .github/workflows/living-underworld-phase37-native.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact native entrance and constructor tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          node --test tests/living-underworld-switchback-fallback.test.mjs > "$RUNNER_TEMP/phase37.tap" 2>&1
          code=$?
          cat "$RUNNER_TEMP/phase37.tap"
          test -z "$(git status --porcelain --untracked-files=all)" || exit 4
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase37-native-entrance-evidence
          path: ${{ runner.temp }}/phase37.tap
          retention-days: 7
