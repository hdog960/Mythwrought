name: Snow S7 original-game WebGL2 cached winter proof
on:
  push:
    branches:
      - research/snow-s7-cached-real-webgl2-isolated-20261123
    paths:
      - '.github/workflows/snow-s7-cached-real-webgl2.yml'
      - 'scripts/ci/snow-s7-cached-post-desert-webgl2.mjs'
permissions:
  contents: read
concurrency:
  group: snow-s7-cached-real-webgl2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-post-desert-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Checkout exact separate Desert Phase 3 release
        uses: actions/checkout@v4
        with:
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          path: production-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source refs, read-only production and new browser script syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C production-readonly rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check scripts/ci/snow-s7-cached-post-desert-webgl2.mjs
          node --check src/manual-biomes/snowy-s7-mesh-tint-source-cache.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Install only required Chromium and original PNG decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Single seeded actual original game S7 cached color and edited glacier
        run: |
          python3 -m http.server 4173 --directory production-readonly >/tmp/snow-s7-webgl2.log 2>&1 &
          node scripts/ci/snow-s7-cached-post-desert-webgl2.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Upload real comparison and source SHA evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-s7-cached-956-original-webgl2-${{ github.sha }}
          path: artifacts/snow-s7-cached-post-desert-real-webgl2/
          if-no-files-found: ignore
          retention-days: 7
