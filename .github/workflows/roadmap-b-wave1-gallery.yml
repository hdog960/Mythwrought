name: Roadmap B Waves1-2 isolated source WebGL2 gallery
on:
  pull_request:
    paths:
      - 'src/building-pool/roadmap-b/**'
      - 'tests/building-pool/roadmap-b/**'
      - '.github/workflows/roadmap-b-wave1-gallery.yml'
permissions:
  contents: read
jobs:
  roadmap-b-1b-native:
    if: ${{ github.event.pull_request.number == 241 && github.event.pull_request.draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Builder 1B source-specific native and Chromium acceptance
        run: node scripts/ci/run-isolated.mjs roadmap-1b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-b-1b-exact-native-evidence
          path: artifacts/
          if-no-files-found: ignore
  roadmap-b-2b-native:
    if: ${{ github.event.pull_request.number == 241 && github.event.pull_request.draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Builder 2B source-specific native and Chromium acceptance
        run: |
          mapfile -d '' files < <(find tests/building-pool/roadmap-2b -type f -name '*.test.mjs' -print0 | sort -z)
          test "${#files[@]}" -gt 0
          node --test --test-concurrency=1 "${files[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-b-2b-exact-native-evidence
          path: artifacts/
          if-no-files-found: ignore
  roadmap-b-webgl2:
    if: ${{ github.event.pull_request.number == 241 && github.event.pull_request.draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser witness tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Capture exact source-supported 72 WebGL2 landscape PNGs
        env:
          ROADMAP_B_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-b/source-gallery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-b-waves12-exact-source-webgl2
          path: artifacts/roadmap-b-waves12-webgl2
          if-no-files-found: warn
