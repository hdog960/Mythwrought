name: Mountain V8 isolated IndexedDB evidence and original mountain AABB audit
# One focused native original checkout only. Triggered by workflow creation;
# not repeated by future doc/source pushes; no broad/root/PR jobs.
on:
  push:
    branches:
      - mountain-v8-integration-preflight-isolated-20261122
    paths:
      - .github/workflows/mountain-v8-indexeddb-and-shape-ownership-focused.yml
permissions:
  contents: read
jobs:
  cross-store-and-shape-proof:
    if: github.ref == 'refs/heads/mountain-v8-integration-preflight-isolated-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Read-only isolated original checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Original native Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original SHA and only new syntax plus 13 narrowly targeted tests
        run: |
          node --version
          git rev-parse HEAD
          node --check src/manual-biomes/mountain-v8-indexeddb-owner-evidence.mjs
          node --check src/manual-biomes/mountain-v8-existing-mountain-shape-ownership.mjs
          node --check tests/mountain-v8-indexeddb-owner-evidence.test.mjs
          node --check tests/mountain-v8-existing-mountain-shape-ownership.test.mjs
          node --test --test-concurrency=1 \
            tests/mountain-v8-indexeddb-owner-evidence.test.mjs \
            tests/mountain-v8-existing-mountain-shape-ownership.test.mjs
