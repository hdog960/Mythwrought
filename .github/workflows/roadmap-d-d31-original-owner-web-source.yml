name: Builder D31 original Pack2 physical web clearance isolated narrow native
on:
  push:
    branches:
      - builder-d-d31-original-pack2-oblique-web-isolated-20261122
    paths:
      - 'src/building-pool/roadmap-d/d31-*'
      - 'tests/building-pool/roadmap-d/d31-*'
      - 'docs/building-pool/roadmap-d/D31_*'
      - '.github/workflows/roadmap-d-d31-original-owner-web-source.yml'
permissions:
  contents: read
concurrency:
  group: builder-d-d31-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-original-source-owner-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Check exact HEAD and unmodified original source owners and protected parent
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 'e5cb25c97ce6cd9c223e8fb79c1046f69253797e'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave16.mjs)" = 'da58c75008bbc286d2512ac8c47ee6b44b6f822d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave17.mjs)" = 'efa2763a2ad40fe2df5179c1138b3e56732b3031'
          test "$(git rev-parse HEAD:src/block-packs/pack-2/definitions.mjs)" = 'f9583417467c991674e5a1bd8c14b9b2816a58f9'
          test "$(git rev-parse HEAD:src/voxel.mjs)" = 'beaa7c9de60e6326128357c9dd3a498a154f255a'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check exactly two new source modules and two focused tests
        run: |
          node --check src/building-pool/roadmap-d/d31-pack2-owner-oblique-preview.mjs
          node --check src/building-pool/roadmap-d/d31-original-pack2-web-envelope-audit.mjs
          node --check tests/building-pool/roadmap-d/d31-pack2-oblique-preview.pure.test.mjs
          node --check tests/building-pool/roadmap-d/d31-original-pack2-web-envelope.source.test.mjs
      - name: Run ONLY four new pure plus two new genuine original W16/W17 source tests
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-d/d31-pack2-oblique-preview.pure.test.mjs \
            tests/building-pool/roadmap-d/d31-original-pack2-web-envelope.source.test.mjs
