name: Roadmap A Pack5 source ray floating-boundary classification
on:
  push:
    branches:
      - roadmap-a-pack5-ray-grazing-native-20261122
    paths:
      - '.github/workflows/roadmap-a-pack5-ray-grazing-native.yml'
permissions:
  contents: read
jobs:
  pack5-focused-source-ray-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: New raw-and-edge-classified source ray geometry tests only
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-pack5-ray-selection-core.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-pack5-ray-selection-producer.test.mjs
