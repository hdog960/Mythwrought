name: Mining release targeted S5 celestial reload qualification
on:
  push:
    branches: [probe/production-mining-sky-targeted-20261126]
    paths: ['.github/workflows/production-mining-sky-targeted.yml']
permissions:
  contents: read
jobs:
  s5-celestial-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_SHA: 766fd0bd3dc1b792ba052faf577accc758d00a13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 766fd0bd3dc1b792ba052faf577accc758d00a13
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove identical sky runtime and original browser test inputs
        run: |
          test "$(git rev-parse HEAD)" = '766fd0bd3dc1b792ba052faf577accc758d00a13'
          git fetch --no-tags --depth=1 origin b4fd7af4a7bbe700794988dc532341bc1eec24cd
          git diff --exit-code b4fd7af4a7bbe700794988dc532341bc1eec24cd HEAD -- . \
            ':(exclude)tests/compact-menu.test.mjs' \
            ':(exclude)tests/app-update-browser.mjs' \
            ':(exclude)tests/mob-final-offline-upgrade-browser.mjs' \
            ':(exclude)scripts/ci/manual-biomes-m5-offline-pwa-webgl2.mjs' \
            ':(exclude)scripts/ci/manual-v6-live-webgl2.mjs' \
            ':(exclude).github/workflows/production-mining-diagnostic.yml'
      - name: Install same pinned browser and PNG decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: One targeted unchanged S5 retry and S6 legacy compatibility
        run: |
          python3 -m http.server 4173 >/tmp/mythwrought-targeted-sky.log 2>&1 &
          node tests/sky/s5-events-browser.mjs
          node tests/sky/s6-legacy-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-targeted-s5-s6
          path: artifacts/sky-*/
          if-no-files-found: warn
