name: Unified final outstanding scenery and single walking route
on:
  push:
    branches: [probe/unified-final-two-gates-20261126]
    paths: ['tests/nonblock-catalog-browser.mjs','scripts/ci/unified-m5-missing-enchanted-webgl2.mjs','.github/workflows/unified-final-two-gates.yml']
permissions:
  contents: read
jobs:
  enchanted-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Freeze source and check already proven center witness correction
        run: |
          test "$(git rev-parse HEAD^)" = f48c42e85c979dd66d8b42db0e8b01dd531b0fe6
          test -z "$(git diff HEAD^ HEAD -- src index.html styles.css sw-m5.js sw-nonblock-stage.js nonblock-stage-assets.json)"
          node --check tests/nonblock-catalog-browser.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7
          npx playwright install chromium
      - name: Only outstanding ten enchanted fungi source instances
        env:
          NONBLOCK_CATALOG_SET: enchanted-fungi
        run: |
          python3 -m http.server 4173 >/tmp/unified-fungi.log 2>&1 &
          node tests/nonblock-catalog-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-final-enchanted-catalog
          path: artifacts/
          if-no-files-found: warn
  remaining-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Freeze game source and ensure original genuine route restrictions
        run: |
          test "$(git rev-parse HEAD^)" = f48c42e85c979dd66d8b42db0e8b01dd531b0fe6
          test -z "$(git diff HEAD^ HEAD -- src index.html styles.css sw-m5.js sw-nonblock-stage.js nonblock-stage-assets.json)"
          node --check scripts/ci/unified-m5-missing-enchanted-webgl2.mjs
          if grep -En '(__mythwroughtTest[.]teleport|setOrientation[(]|aimAt[(]|editBiomeCell[(]|Object[.]assign[(]player|requestAnimationFrame[ ]*=|Date[.]now[ ]*=)' scripts/ci/unified-m5-missing-enchanted-webgl2.mjs; then exit 1; fi
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7
          npx playwright install chromium
      - name: Only cancelled final 932x430 enchanted natural route and cold reload
        env:
          M5_VIEWPORT: 932x430
        run: node scripts/ci/unified-m5-missing-enchanted-webgl2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-final-enchanted-walk
          path: artifacts/manual-biomes-m5-long-932x430/
          if-no-files-found: warn
