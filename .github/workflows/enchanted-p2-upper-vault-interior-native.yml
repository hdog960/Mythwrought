# Only new 5-cell original upper mineral VAULT physically walked
# with original source, authentic body/headroom and real support AIR veto.
name: Enchanted P2 Original Upper Mineral Vault Interior Native
on:
  push:
    branches:
      - research/enchanted-p2-third-band-upper-lateral-20261123
    paths:
      - .github/workflows/enchanted-p2-upper-vault-interior-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-upper-vault-room-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original physics/upper-cave author immutable and new source syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/cave-approaches/upper-network.mjs)" = "a48bd919685b326f062ffa1c5856fa27c2619be8"
          node --check src/manual-biomes/enchanted-original-upper-mineral-lateral-return.mjs
          node --check tests/manual-biomes/enchanted-original-upper-vault-interior-real-m7.test.mjs
      - name: Only new original mineral vaulted room entry+return and true mined floor veto
        run: node --test tests/manual-biomes/enchanted-original-upper-vault-interior-real-m7.test.mjs
