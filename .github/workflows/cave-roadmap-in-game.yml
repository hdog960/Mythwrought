name: Mythwrought Cave Roadmap Actual In-Game WebGL2
on:
  pull_request:
    paths:
      - 'src/main.mjs'
      - 'index.html'
      - 'src/manual-caves/**'
      - 'tests/cave-roadmap-in-game-browser.mjs'
      - '.github/workflows/cave-roadmap-in-game.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cave-main-game-browser:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'integration/caves-all-to-homescreen-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Original game main.mjs cave mode actual WebGL2 screenshot acceptance
        env:
          CAVE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/cave-roadmap-in-game-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mythwrought-cave-actual-game-webgl2
          path: artifacts/cave-roadmap-actual-game/
          if-no-files-found: error
          retention-days: 30
