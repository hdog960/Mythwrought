name: MYTHWROUGHT Builder D Wave4 authentic source WebGL2 acceptance (draft-only)
on:
  pull_request:
    paths:
      - 'src/building-pool/roadmap-d/d1-original-institutions-wave4.mjs'
      - 'tests/building-pool/roadmap-d/d1-original-institutions-wave4*'
      - 'tests/building-pool/roadmap-d/audit-wave4-gallery.mjs'
      - 'tests/roadmap-d-wave4.test.mjs'
      - '.github/workflows/roadmap-d-d4-source-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mythwrought-roadmap-d-wave4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  builder-d-wave4-native-and-authentic-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 181 canonical source buildings and all historical same-type D4 matches
        run: node --test tests/building-pool/roadmap-d/d1-original-institutions-wave4.test.mjs
      - name: Require real Chromium for original-source WebGL2 acceptance
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
      - name: Install pinned independent PNG decoder for CRC validation
        run: npm install --no-save --no-audit --no-fund pngjs@7.0.0
      - name: Render 8 original source structures x 2 actual views x 3 phone-landscape dimensions
        run: node --test tests/building-pool/roadmap-d/d1-original-institutions-wave4-webgl2.test.mjs
      - name: Independently audit 48 genuine captures for CRC, PNG SHA, source SHA, GL and occupied pixels
        run: node tests/building-pool/roadmap-d/audit-wave4-gallery.mjs
      - name: Preserve authentic cube-proxy source screenshots for actual image review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-d-wave4-48-genuine-webgl2-source-captures
          path: artifacts/building-pool/roadmap-d/d1-original-institutions-wave4-webgl2-cube-proxy/
          if-no-files-found: ignore
