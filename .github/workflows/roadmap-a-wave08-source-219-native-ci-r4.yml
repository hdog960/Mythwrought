name: Roadmap A Wave08 twelve authored source blueprints 219 metadata native R4
on:
  push:
    branches:
      - roadmap-a-wave08-source-219-native-ci-r4-20261123
    paths:
      - '.github/workflows/roadmap-a-wave08-source-219-native-ci-r4.yml'
permissions:
  contents: read
jobs:
  original-wave08-native-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Only new original source and provenance syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-wave08.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-219-provisional.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave08.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-219-provisional.test.mjs
      - name: Only seven original Wave08 source physical, 79-peers D4 and 207-to-219 provenance tests
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-wave08.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-a5-219-provisional.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave08-219-original-source-provenance-r4
          path: artifacts/roadmap-a-a5/A5_SETTLEMENT_HANDOFF_219_PROVISIONAL.json
          if-no-files-found: error
          retention-days: 14
