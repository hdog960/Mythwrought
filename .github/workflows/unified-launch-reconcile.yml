name: Unified launch-pinned cache reconciliation
on:
  push:
    branches: [probe/unified-home-screen-launch-reconcile-20261128]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8400d13a6f5521901cbf0909a0c4f6e2e79c1629
          path: prior-production
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f8b0dc6dbbc68f375c24dc7be7af044da08da4ee
          path: prior-history
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Exact released save inheritance and actual cache union
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/main.mjs
          node --check src/manual-biomes/profile-world.mjs
          node --check src/gpu-recovery.mjs
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node tests/ci/unified-post-save-cache-closure.mjs
      - name: Affected Creative Navigation save and shell contracts only
        run: |
          node --test tests/creative-integration/*.test.mjs tests/navigation00-*.test.mjs tests/manual-biomes/profile-world.test.mjs tests/manual-biomes/m2-runtime-bridge.test.mjs tests/mining-save-replay-scope.test.mjs tests/physical-mining-trace.test.mjs tests/compact-menu.test.mjs tests/app-update.test.mjs tests/unified-offline-atomic-cache.test.mjs tests/ci/nonblock-cache-manifest.test.mjs tests/veilreach.test.mjs tests/shared-world-height*.test.mjs tests/gpu-edit-batch.test.mjs
  integrated-ui:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [navigation, installed, veilreach-install]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8400d13a6f5521901cbf0909a0c4f6e2e79c1629
          path: prior-production
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Pinned real Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Actual owner controls and historical-profile history
        if: matrix.gate == 'creative'
        run: |
          python3 -m http.server 4174 >/tmp/unified-ui.log 2>&1 &
          site_server=$!
          trap 'kill "$site_server" 2>/dev/null || true' EXIT
          node tests/creative-integration/phase5-building-controls-browser.mjs
          node tests/creative-integration/single-profile-history-browser.mjs
      - name: Actual previous-production discovery and offline waypoint upgrade
        if: matrix.gate == 'navigation'
        run: node scripts/ci/navigation-production-upgrade.mjs
      - name: Actual missing-helper rollback and installed source byte audit
        if: matrix.gate == 'installed'
        run: UNIFIED_PREVIOUS_ROOT=prior-production node tests/unified-history-upgrade-browser.mjs
      - name: Current combined upper owner history and offline upgrade
        if: matrix.gate == 'upper-creative'
        run: node scripts/ci/creative-shared-height-upgrade.mjs
      - name: Exact previous Veilreach save and normal New World same-install upgrade
        if: matrix.gate == 'veilreach-install'
        run: VEILREACH_PREVIOUS_ROOT=prior-production node tests/veilreach-home-screen-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-post-save-${{ matrix.gate }}
          path: artifacts/
          if-no-files-found: warn
