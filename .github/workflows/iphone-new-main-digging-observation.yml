name: Isolated real integrated MAIN original digging vs protected draft baseline (NO RELEASE)
on:
  push:
    branches:
      - probe/iphone-new-main-digging-observation-291-20261121
permissions:
  contents: read
jobs:
  real-original-game-source-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact new merged main and zero game-source mutations
        run: |
          test "$(git rev-parse HEAD^)" = "7016e14cd6289f45eaf7fc6a79a362b47996df65"
          git diff --exit-code 7016e14cd6289f45eaf7fc6a79a362b47996df65 HEAD -- src/ index.html styles.css tests/ sw-m5.js
          node --check scripts/ci/iphone-new-main-digging-observation.mjs
      - name: Install original Chromium browser with WebGL2 SwiftShader
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Pin read-only protected draft distinct from integrated release
        uses: actions/checkout@v4
        with:
          ref: 82f8828945b464acf0a71faddfe2d18ffa4df245
          path: baseline-draft
      - name: Run actual source unmodified deep edits and reload with real WebGL2
        run: |
          python3 -m http.server 4173 --directory . >/tmp/current-main.log 2>&1 &
          python3 -m http.server 4174 --directory baseline-draft >/tmp/protected-draft.log 2>&1 &
          node scripts/ci/iphone-new-main-digging-observation.mjs
      - name: Preserve genuine paired raw edit samples and PNGs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-original-merged-main-vs-protected-draft-digging
          path: artifacts/iphone-integrated-main-original-digging/
          if-no-files-found: warn
          retention-days: 14
