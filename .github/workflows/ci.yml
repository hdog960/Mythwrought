name: Mythwrought verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  node-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and model tests
        run: |
          node --check src/main.mjs
          node --check src/voxel.mjs
          npm test
      - name: Install free browser test tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Landscape WebGL2 browser smoke
        run: |
          python3 -m http.server 4173 >/tmp/mythwrought-site.log 2>&1 &
          node tests/browser-smoke.mjs
          node tests/touch-browser.mjs
          node tests/layout-browser.mjs
          node tests/seam-browser.mjs
          node tests/movement-browser.mjs
          node tests/blocks-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mythwrought-browser-smoke
          path: artifacts/
          if-no-files-found: ignore
