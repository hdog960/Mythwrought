name: Mythwrought verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only cancel older attempts for the SAME PR. Main is not canceled.
concurrency:
  group: mythwrought-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  node-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine verification scope (fail closed)
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/select-scope.mjs >> "$GITHUB_OUTPUT"
      - name: Fast syntax and CI contract tests
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          node --check src/main.mjs
          node --check src/voxel.mjs
          node --check src/meadow.mjs
          node --check src/grove.mjs
          node --check src/canopy.mjs
          node --check src/storybook-materials.mjs
          node --check src/grotto.mjs
          node --check src/gpu-recovery.mjs
          node --check src/gpu-pipeline.mjs
          node --check src/cave-runes.mjs
          node --check src/sky.mjs
          node --test tests/ci/*.test.mjs
          if [ "$MODE" != 'docs-only' ]; then npm test; fi
      - name: Focused native tests for changed independent lanes
        if: steps.scope.outputs.mode == 'isolated'
        env:
          CI_LANES: ${{ steps.scope.outputs.lanes }}
        run: node scripts/ci/run-isolated.mjs "$CI_LANES"
      - uses: actions/cache@v4
        if: steps.scope.outputs.mode != 'docs-only'
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: mythwrought-ubuntu-node22-playwright1.58.2-pngjs7-v1
      - name: Install pinned browser test tools
        if: steps.scope.outputs.mode != 'docs-only'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Focused landscape WebGL2 smoke and layout
        if: steps.scope.outputs.mode == 'isolated'
        run: |
          python3 -m http.server 4173 >/tmp/mythwrought-site.log 2>&1 &
          node tests/browser-smoke.mjs
          node tests/layout-browser.mjs
      - name: Full 20-script WebGL2 gate (shared, integration and main)
        if: steps.scope.outputs.mode == 'full'
        run: |
          python3 -m http.server 4173 >/tmp/mythwrought-site.log 2>&1 &
          node tests/browser-smoke.mjs
          node tests/exploration-map-browser.mjs
          node tests/touch-browser.mjs
          node tests/layout-browser.mjs
          node tests/seam-browser.mjs
          node tests/movement-browser.mjs
          node tests/blocks-browser.mjs
          node tests/persistence-browser.mjs
          node tests/preflight-browser.mjs
          node tests/vault-browser.mjs
          node tests/mirror-browser.mjs
          node tests/foreground-browser.mjs
          node tests/meadow-browser.mjs
          node tests/grove-browser.mjs
          node tests/canopy-browser.mjs
          node tests/storybook-browser.mjs
          node tests/grotto-browser.mjs
          node tests/voxel-landmarks-browser.mjs
          node tests/live-world-browser.mjs
          node tests/context-restore-browser.mjs
      - name: Advisory queue health snapshot
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/queue-health.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mythwrought-browser-smoke
          path: artifacts/
          if-no-files-found: ignore
