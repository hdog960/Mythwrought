name: Enchanted Phase 2 Three Tree Matched Original WebGL2 (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-three-tree-visual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonwillow-native-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original-source Moonwillow structural, player headroom and authentic M7 regression
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-tree-candidates.mjs
          node --check tests/manual-biomes/enchanted-moonwillow-umbrella-source.test.mjs
          node --test \
            tests/manual-biomes/enchanted-moonwillow-umbrella-source.test.mjs \
            tests/manual-biomes/enchanted-tree-structural-branches.test.mjs \
            tests/manual-biomes/enchanted-tree-walking-clearance.test.mjs \
            tests/manual-biomes/enchanted-tree-walking-real-m7.test.mjs \
            tests/manual-biomes/enchanted-trees-phase2.test.mjs
  source-specific-three-tree-original-engine:
    needs: moonwillow-native-source-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and original renderer test syntax
        run: |
          git rev-parse HEAD
          git status --short
          node --check scripts/ci/enchanted-phase2-three-tree-matched-webgl2.mjs
          node --check src/manual-biomes/enchanted-tree-candidates.mjs
          node --check src/manual-biomes/environment-v7.mjs
          node --check src/manual-biomes/enchanted-tree-walking-clearance.mjs
          node --check src/manual-biomes/enchanted-tree-source-cache.mjs
      - name: Install targeted original Chromium WebGL2 proof deps
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: One matched revised umbrella Moonwillow pair after source-native acceptance
        env:
          ENCHANTED_VISUAL_SPECIES: moonwillow
        run: node scripts/ci/enchanted-phase2-three-tree-matched-webgl2.mjs
      - name: Retain source-bound SHA and original-renderer screenshots or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enchanted-phase2-three-tree-original-webgl2-932x430
          path: artifacts/enchanted-forest/phase2-three-tree-matched/
          if-no-files-found: warn
          retention-days: 14
