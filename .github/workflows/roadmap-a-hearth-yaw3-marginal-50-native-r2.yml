name: Roadmap A hearth/yaw3 original 50 marginal source hits and 3x3 probe
on:
  push:
    branches:
      - roadmap-a-hearth-yaw3-marginal-50-native-r2-20261123
    paths:
      - '.github/workflows/roadmap-a-hearth-yaw3-marginal-50-native-r2.yml'
permissions:
  contents: read
jobs:
  original-cross-tab-changed-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check only revised original source cross-tab and focused test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-owner-seam-thickness-crosstab.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-owner-seam-thickness-crosstab.test.mjs
      - name: Only twelve changed original source margin/candidate and cross-tab tests
        run: node --test tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-owner-seam-thickness-crosstab.test.mjs
