name: Unified targeted remaining original-game qualification
on:
  push:
    branches: [probe/unified-remaining-qualification-20261126]
    paths:
      - 'tests/**'
      - '.github/workflows/unified-remaining-qualification.yml'
permissions:
  contents: read
jobs:
  missing-eggs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            ids: fox
          - shard: 1
            ids: glassback,sunskipper,glownewt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate frozen game source
        run: |
          test "$(git rev-parse HEAD^)" = f48c42e85c979dd66d8b42db0e8b01dd531b0fe6
          test -z "$(git diff HEAD^ HEAD -- src index.html styles.css sw-m5.js sw-nonblock-stage.js nonblock-stage-assets.json)"
          node --check tests/creative-integration/physical-eggs-browser.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7
          npx playwright install chromium
      - name: Four outstanding actual eggs, original admission and saves
        env:
          EGG_SHARD: ${{ matrix.shard }}
          EGG_IDS: ${{ matrix.ids }}
          EGG_FIXED_SEEDS: '1'
        run: |
          python3 -m http.server 4174 >/tmp/unified-eggs.log 2>&1 &
          node tests/creative-integration/physical-eggs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-remaining-eggs-${{ matrix.shard }}
          path: artifacts/creative-eggs/
          if-no-files-found: warn
  map-and-scenery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact frozen game source and targeted prerequisites
        id: prepare
        run: |
          test "$(git rev-parse HEAD^)" = f48c42e85c979dd66d8b42db0e8b01dd531b0fe6
          test -z "$(git diff HEAD^ HEAD -- src index.html styles.css sw-m5.js sw-nonblock-stage.js nonblock-stage-assets.json)"
          node --check tests/exploration-map-browser.mjs
          node --check tests/nonblock-catalog-browser.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7
          npx playwright install chromium
      - name: Actual four-view map isolation and touch
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 -m http.server 4173 >/tmp/unified-map.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/exploration-map-browser.mjs
      - name: Actual staged scenery catalog (previously interrupted)
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 -m http.server 4173 >/tmp/unified-scenery.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/nonblock-catalog-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-remaining-map-scenery
          path: artifacts/
          if-no-files-found: warn
