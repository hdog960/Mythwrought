name: Snow S10 true original game reusable RGB scratch and 16-sample mesh guard
on:
  push:
    branches:
      - research/snow-s10-original-rgb-webgl2-perf-isolated-20261123
    paths:
      - '.github/workflows/snow-s10-original-mesh-webgl2.yml'
      - 'scripts/ci/snow-s10-original-rgb-scratch-webgl2.mjs'
permissions:
  contents: read
concurrency:
  group: snow-s10-original-mesh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-pinned-original-game-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          path: production-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict original refs and only new S10 browser source syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C production-readonly rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          test "$(git hash-object src/manual-biomes/snowy-s10-single-mesh-scratch-pigment.mjs)" = 03e1241626e703d3e39619db28a31ec35c0856b9
          node --check scripts/ci/snow-s10-original-rgb-scratch-webgl2.mjs
          node --check src/manual-biomes/snowy-s10-single-mesh-scratch-pigment.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Pinned Chromium WebGL2 and PNG evidence decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Real seed2026 original versus S10 16-build p50/p95 and strict original geometry
        run: |
          python3 -m http.server 4173 --directory production-readonly >/tmp/snow-s10-real-game.log 2>&1 &
          node scripts/ci/snow-s10-original-rgb-scratch-webgl2.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Preserve real PNG and exact source samples, even if budget fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-s10-exact-mesh-16-samples-${{ github.sha }}
          path: artifacts/snow-s10-original-mesh/
          if-no-files-found: ignore
          retention-days: 7
