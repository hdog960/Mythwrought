name: Creative current production compatibility
on:
  push:
    branches: [creative-current-production-20261125]
permissions:
  contents: read
jobs:
  native-current-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --check src/main.mjs
          node --check src/creative-integration/creative-inventory.mjs
          node --check src/mobs/live-game.mjs
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node --test tests/creative-catalog.test.mjs tests/creative-thumbnails.test.mjs tests/creative-physical-material-census.test.mjs
  current-browser:
    needs: native-current-owners
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        target: [slime,building]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
          python3 -m http.server 4174 > /tmp/creative-http.log 2>&1 &
          if [ "${{ matrix.target }}" = slime ]; then
            EGG_SHARD=2 EGG_OFFSET=4 node tests/creative-integration/physical-eggs-browser.mjs
          else
            node tests/creative-integration/phase5-building-controls-browser.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-current-${{ matrix.target }}
          path: |
            artifacts/creative-eggs/
            artifacts/creative-building/
          if-no-files-found: warn
