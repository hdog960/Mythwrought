name: Roadmap A Wave08 twelve original source plans plus 219 lineage native R3
on:
  push:
    branches:
      - roadmap-a-wave08-source-219-native-ci-r3-20261123
    paths:
      - '.github/workflows/roadmap-a-wave08-source-219-native-ci-r3.yml'
permissions:
  contents: read
jobs:
  real-original-wave08-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Only own-lane Wave08 code and source ledger/test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-wave08.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-219-provisional.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave08.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-219-provisional.test.mjs
      - name: Only four original source geometry/D4 and three exact metadata lineage cases
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-wave08.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-a5-219-provisional.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave08-219-source-only-native-original-provenance-r3
          path: artifacts/roadmap-a-a5/A5_SETTLEMENT_HANDOFF_219_PROVISIONAL.json
          if-no-files-found: error
          retention-days: 14
