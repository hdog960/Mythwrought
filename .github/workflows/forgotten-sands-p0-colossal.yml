name: Forgotten Sands P0 core clearance and walk native
on:
  push:
    branches: [research/forgotten-sands-p0-colossal-search-20261123]
    paths:
      - 'src/manual-biomes/forgotten-sands-grounded-probe.mjs'
      - 'src/manual-biomes/forgotten-sands-colossal-search.mjs'
      - 'tests/forgotten-sands-colossal-search.test.mjs'
      - '.github/workflows/forgotten-sands-p0-colossal.yml'
permissions:
  contents: read
jobs:
  native-clearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node --check src/manual-biomes/forgotten-sands-grounded-probe.mjs
          node --check src/manual-biomes/forgotten-sands-colossal-search.mjs
          node --check tests/forgotten-sands-colossal-search.test.mjs
          node --test tests/forgotten-sands-colossal-search.test.mjs tests/forgotten-sands-grounded-probe.test.mjs tests/forgotten-sands-grounded-scale.test.mjs
