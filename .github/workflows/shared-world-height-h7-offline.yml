name: Shared height H7 original gameplay and offline shell
on:
  push:
    branches: [research/shared-world-height-h1-h2-20261125]
    paths:
      - 'tests/shared-world-height-h7-browser.mjs'
      - '.github/workflows/shared-world-height-h7-offline.yml'
permissions:
  contents: read
jobs:
  native-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --check src/main.mjs
      - run: |
          mkdir -p artifacts/world-height
          node scripts/ci/build-stage-cache-manifest.mjs
          node scripts/ci/build-stage-cache-manifest.mjs --check
          cp nonblock-stage-assets.json artifacts/world-height/
          sha256sum artifacts/world-height/nonblock-stage-assets.json
      - run: node --test tests/shared-world-height-h7-pages.test.mjs tests/shared-world-height-h3.test.mjs tests/shared-world-height-h3-budget.test.mjs
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - run: |
          python3 -m http.server 4174 >/tmp/height-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node tests/shared-world-height-h7-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-height-h7-original-offline
          path: artifacts/world-height/
          if-no-files-found: ignore
