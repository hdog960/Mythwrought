name: Snow S9 exact original WebGL2 mesh-resident pigment and true snow272 camera
on:
  push:
    branches:
      - research/snow-s9-exact-mesh-resident-webgl2-20261123
    paths:
      - '.github/workflows/snow-s9-original-webgl2.yml'
      - 'scripts/ci/snow-s9-original-mesh-resident-browser.mjs'
permissions:
  contents: read
concurrency:
  group: snow-s9-mesh-resident-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-original-mesh-resident:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          path: production-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact checkout, original source hash and new browser harness syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C production-readonly rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          test "$(git hash-object src/manual-biomes/snowy-s9-mesh-resident-pigment.mjs)" = 2a93d327e6613083633f19d8f32799e9347b4f9b
          node --check scripts/ci/snow-s9-original-mesh-resident-browser.mjs
          node --check src/manual-biomes/snowy-s9-mesh-resident-pigment.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Install pinned Chromium WebGL2 and PNG evidence decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Genuine seed2026 source snow272 camera, glacier and timed original source mesh parity
        run: |
          python3 -m http.server 4173 --directory production-readonly >/tmp/snow-s9-real-original.log 2>&1 &
          node scripts/ci/snow-s9-original-mesh-resident-browser.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Publish source-authentic real screenshots and mesh sample manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-s9-source-camera-mesh-${{ github.sha }}
          path: artifacts/snow-s9-seed2026-original-mesh/
          if-no-files-found: ignore
          retention-days: 7
