name: Shared height H4 cross-pack and original WebGL2
on:
  push:
    branches: [research/shared-world-height-h1-h2-20261125]
    paths:
      - 'tests/shared-world-height-h4-sidecars.test.mjs'
      - '.github/workflows/shared-world-height-h4-sidecars.yml'
permissions:
  contents: read
jobs:
  native-and-original-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --check src/main.mjs
      - run: node --test tests/shared-world-height-h4-sidecars.test.mjs tests/manual14-layer.test.mjs tests/manual14-mesh.test.mjs tests/pack3-runtime-stage.test.mjs
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - run: |
          python3 -m http.server 4174 >/tmp/height-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node tests/shared-world-height-browser-corrected.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-height-h4-original-webgl
          path: artifacts/world-height/
          if-no-files-found: ignore
