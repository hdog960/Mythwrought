name: Living Underworld completion 9 - raised offset socket
on:
  push:
    branches:
      - dev/living-underworld-phase48-crown-and-offset-20261127
    paths:
      - .github/workflows/living-underworld-phase48-socket-native.yml
permissions:
  contents: read
jobs:
  offset-socket-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact source and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/living-underworld/offset-socket-stair-research.mjs
          node --check scripts/underworld/phase48-offset-socket-native.mjs
      - name: New raised offset geometry and actual source/controller gate
        run: node scripts/underworld/phase48-offset-socket-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase48-offset-socket-native
          path: ${{ runner.temp }}/phase48-socket/
          retention-days: 7
