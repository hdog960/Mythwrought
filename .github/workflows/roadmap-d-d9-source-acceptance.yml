name: MYTHWROUGHT Builder D Wave9 221-source 1210 D4 and true 48-frame WebGL2 acceptance (draft-only)
on:
  pull_request:
    paths:
      - 'src/building-pool/roadmap-d/d1-original-institutions-wave9.mjs'
      - 'tests/building-pool/roadmap-d/d1-original-institutions-wave9*'
      - 'tests/building-pool/roadmap-d/audit-wave9-gallery.mjs'
      - 'tests/roadmap-d-wave9.test.mjs'
      - '.github/workflows/roadmap-d-d9-source-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mythwrought-builder-d-wave9-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  builder-d-wave9-real-source-and-authentic-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require 153 protected original plus 68 new = 221 sources, all 1210 strict bidirectional eight-way D4 pairs
        run: node --test --test-concurrency=1 tests/building-pool/roadmap-d/d1-original-institutions-wave9.test.mjs tests/building-pool/roadmap-d/d5-historical-bidirectional-d4.test.mjs
      - name: Require genuine installed Chromium and pinned independent PNG decoder
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          npm install --no-save --no-audit --no-fund pngjs@7.0.0
      - name: Render eight original full source volumetric structures in true Chromium WebGL2, exterior and section at three landscapes
        run: node --test tests/building-pool/roadmap-d/d1-original-institutions-wave9-webgl2.test.mjs
      - name: Independently audit all 48 genuine PNG chunks CRC/SHA256 source fingerprints camera GL and true cutaways
        run: node tests/building-pool/roadmap-d/audit-wave9-gallery.mjs
      - name: Publish real 48-frame WebGL2 cube-source diagnostics, never final physical Pack or iPhone approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-d-wave9-48-real-chromium-source-frames
          path: artifacts/building-pool/roadmap-d/d1-original-institutions-wave9-webgl2-cube-proxy/
          if-no-files-found: ignore
