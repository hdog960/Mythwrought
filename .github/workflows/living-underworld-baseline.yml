name: Living Underworld Phase 1 — Real M7 Cave Density (isolated)

on:
  pull_request:
    paths:
      - 'src/living-underworld/**'
      - 'scripts/underworld/**'
      - 'tests/living-underworld-foundation.test.mjs'
      - 'tests/living-underworld-network.test.mjs'
      - '.github/workflows/living-underworld-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-natural-voxel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head (no merge commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native sources and worldwide network joins
        run: |
          node --check src/living-underworld/density-audit.mjs
          node --check src/living-underworld/procedural-core.mjs
          node --check src/living-underworld/worldwide-network.mjs
          node --check scripts/underworld/audit-m7-density.mjs
          node --test tests/living-underworld-foundation.test.mjs tests/living-underworld-network.test.mjs
      - name: Read actual M7 natural voxels across twenty seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/living-underworld
          git rev-parse HEAD > artifacts/living-underworld/checked-out-head.txt
          for seed in 179 -17 2026 314159 -987 451 0 1 17 42 12345 -12345 8675309 -8675309 777 991 -991 65535 24680 13579; do
            node scripts/underworld/audit-m7-density.mjs "${seed}" 8 > "artifacts/living-underworld/m7-seed-${seed}.json"
          done
          sha256sum artifacts/living-underworld/*.json > artifacts/living-underworld/SHA256SUMS
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='artifacts/living-underworld';
          const files=fs.readdirSync(dir).filter(x=>x.endsWith('.json'));
          if(files.length!==20)throw Error('Expected exactly 20 real M7 density reports');
          let air=0,total=0;
          for(const file of files){
            const r=JSON.parse(fs.readFileSync(dir+'/'+file,'utf8'));
            if(r.overall.total!==79488||r.schema!=='living-underworld-density-audit-v1')
              throw Error('Untrusted M7 report '+file);
            air+=r.overall.air;total+=r.overall.total;
          }
          const result={exactHead:fs.readFileSync(dir+'/checked-out-head.txt','utf8').trim(),
            seedCount:files.length,air,total,percentage:100*air/total,
            note:'Real M7 natural voxel sampling; excludes player edits; connectivity and entrances unmeasured'};
          fs.writeFileSync(dir+'/SUMMARY.json',JSON.stringify(result,null,2)+'\n');
          console.log('Real M7 aggregate',JSON.stringify(result));
          NODE
          sha256sum artifacts/living-underworld/SUMMARY.json >> artifacts/living-underworld/SHA256SUMS
      - name: Measure detached worldwide network candidate separately (NOT playable M7)
        run: |
          node scripts/underworld/audit-network-prototype.mjs > artifacts/living-underworld/NETWORK_PROTOTYPE_ONLY.jsonl
          sha256sum artifacts/living-underworld/NETWORK_PROTOTYPE_ONLY.jsonl >> artifacts/living-underworld/SHA256SUMS
      - name: Preserve exact-head M7 + explicitly unintegrated network evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-underworld-phase1-m7-20seed-and-detached-network
          path: artifacts/living-underworld/
          if-no-files-found: warn
          retention-days: 14
