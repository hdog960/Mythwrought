name: Manual Four-Biome M2 Real WebGL2 (draft candidate only)

on:
  pull_request:
    paths:
      - 'src/main.mjs'
      - 'src/manual-biomes/**'
      - 'scripts/ci/manual-biomes-m2-live-webgl2.mjs'
      - 'tests/manual-biomes/**'
      - '.github/workflows/manual-four-biomes-m2-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-biome-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify four-biome candidate syntax
        run: |
          node --check src/main.mjs
          node --check src/manual-biomes/m2-runtime-bridge.mjs
          node --check scripts/ci/manual-biomes-m2-live-webgl2.mjs
      - name: Install pinned genuine Chromium browser tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Execute real game four-biome WebGL2 captures and profile save/reload
        run: node scripts/ci/manual-biomes-m2-live-webgl2.mjs
      - name: Preserve authentic screenshots and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythwrought-manual-four-biomes-m2-real-chromium
          path: artifacts/manual-biomes-m2-live/
          if-no-files-found: warn
          retention-days: 14
