name: Unified final targeted regression correction
on:
  push:
    branches: [probe/unified-final-regressions-20261127]
permissions:
  contents: read
jobs:
  gpu-publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/gpu-edit-batch.test.mjs
  frostwraith:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Single previously unqualified egg, actual startup and UI
        env:
          EGG_SHARD: '3'
          EGG_ONLY: frostwraith
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check tests/creative-integration/physical-eggs-browser.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7
          npx playwright install chromium
          python3 -m http.server 4174 >/tmp/unified-egg.log 2>&1 &
          node tests/creative-integration/physical-eggs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-frostwraith-only
          path: artifacts/creative-eggs/
