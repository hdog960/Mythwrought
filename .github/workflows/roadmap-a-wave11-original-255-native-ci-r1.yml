name: Roadmap A Wave11 genuine original source twelve and 255 provenance native R1
on:
  push:
    branches:
      - roadmap-a-wave11-original-255-native-ci-r1-20261123
    paths:
      - '.github/workflows/roadmap-a-wave11-original-255-native-ci-r1.yml'
permissions:
  contents: read
jobs:
  original-wave11-source-only-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Syntax only for five changed original Wave11 source and tests
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-wave11.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-255-provisional.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave11.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-255-provisional.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave11-protected-128-only-d4.test.mjs
      - name: Nine focused genuine original source geometry, both vaults, 243 immutable records and historical128 new-only D4 tests
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-wave11.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-a5-255-provisional.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-wave11-protected-128-only-d4.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave11-255-original-source-provenance-r1
