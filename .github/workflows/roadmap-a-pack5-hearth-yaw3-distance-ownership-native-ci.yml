    branches:
      - roadmap-a-pack5-hearth-yaw3-distance-ownership-native-ci-20261122
    paths:
      - '.github/workflows/roadmap-a-pack5-hearth-yaw3-distance-ownership-native-ci.yml'
permissions:
  contents: read
jobs:
  original-strict-renderer-box-distance-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Only changed 208-seam classifier original source/test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-strict-world-ray-audit.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-strict-world-ray-audit.test.mjs
      - name: Only thirteen new original hearth yaw3 true physics/renderer-source tests
        run: node --test tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-strict-world-ray-audit.test.mjs
