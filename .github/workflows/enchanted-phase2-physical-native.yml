# Isolated changed-test recovery: original native cache canonical-key
# rejection and 288-chunk source parity only. On previous exact unchanged
# source, the genuine four 14-leg climate walks plus player-edit cache
# eviction test passed 2/2 in #45084113198. Do NOT rerun them or Chromium.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-immutable-site-key-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and changed-test syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-tree-site-biome-cache.mjs
          node --check tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs
      - name: Original-world canonical keys, bounded FIFO, cave veto and 288-chunk regression
        run: node --test tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs
