# Isolated candidate-only source validation. Previous 44/44 authentic M7
# tests at commit 15f7521f92954d1861163d2a295712c8483b5975 remain reusable.
# This revision adds a five-capacity original-M7 data comparison;
# prior 9/9 exact-source tests are reused for unchanged code.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-m7-dense-memory-and-diagonal-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source revision and focused module syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/environment-v7.mjs
          node --check src/manual-biomes/enchanted-tree-source-cache.mjs
          node --check tests/manual-biomes/enchanted-tree-source-cache.test.mjs
          node --check tests/manual-biomes/enchanted-tree-cache-capacity-real-m7.test.mjs
          node --check tests/manual-biomes/enchanted-tree-multistep-diagonal-real-m7.test.mjs
      - name: Run only affected actual-source native tests
        run: |
          node --test \
            tests/manual-biomes/enchanted-tree-source-cache.test.mjs \
            tests/manual-biomes/enchanted-tree-cache-capacity-real-m7.test.mjs \
            tests/manual-biomes/enchanted-tree-multistep-diagonal-real-m7.test.mjs \
            tests/manual-biomes/enchanted-tree-source-cost.test.mjs \
            tests/manual-biomes/enchanted-tree-physical-census-seams.test.mjs
