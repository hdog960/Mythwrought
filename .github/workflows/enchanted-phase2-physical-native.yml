# One isolated original-M7 density-gate source experiment. Reuse existing
# exact 14/14 native and original WebGL2 results where source is unchanged.
# This rerun checks the original native .52+.34 floating point upper bound and connected climate tracks,
# not the entire repo, browsers, other developer suites or CI queues.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-density-and-long-stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact changed source and focused syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/environment-v7.mjs
          node --check tests/manual-biomes/enchanted-tree-source-site-reach.test.mjs
          node --check tests/manual-biomes/enchanted-tree-long-stream-density-real-m7.test.mjs
      - name: Run affected original-source density, 48-chunk parity and 288-chunk climate tracks
        run: |
          node --test \
            tests/manual-biomes/enchanted-tree-long-stream-density-real-m7.test.mjs \
            tests/manual-biomes/enchanted-tree-source-site-reach.test.mjs \
            tests/manual-biomes/enchanted-tree-source-cost.test.mjs
