# Isolated original-M7 proven bounded BFS source restored exactly to
# native accepted blob from Actions #45092293445. Retain the source-real
# stratified Enchanted/Desert acceptance from Actions #45092467293.
# Run these THREE focused original physics/source tests only: no browser,
# full suite, other developer workflows, CI cancellation or deployment.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-restored-bfs-crossings:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exactly restored native source and three focused test bodies
        run: |
          git rev-parse HEAD
          git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          node --check src/manual-biomes/enchanted-original-pedestrian-search.mjs
          node --check tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
      - name: Proven source-grounded M7 bounds, original stepPlayer and all-climate survey
        run: |
          node --test tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
