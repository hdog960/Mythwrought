# Corrected only a Desert test fixture that mislabeled a real warped-biome
# start. Reuse passing seed -88 directed survey from #45092615665 and
# prior source/native graph admissions. No repeated broad CI or Chromium.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-directed-pedestrian-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact bounded original-world helper and changed-test syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-original-pedestrian-search.mjs
          node --check tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
      - name: Only corrected authentic Desert target-directed traversal
        run: |
          node --test --test-name-pattern="target-directed search retains" \
            tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
