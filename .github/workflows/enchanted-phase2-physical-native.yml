# Exact original-M7 isolated enchanted Phase 2 source-only change.
# Standalone canopy source probes now use reviewed bounded FIFO and real
# original-world 14-leg winding biome-border walking gains new coverage.
# Reuse unchanged 288-chunk cache, GPU and Moonwillow browser evidence.
# Do NOT duplicate broad CI, browser screenshot or developer workflows.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canopy-bounded-source-and-winding-original-m7:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source and new focused tests
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-tree-walking-clearance.mjs
          node --check tests/manual-biomes/enchanted-tree-walking-clearance.test.mjs
          node --check tests/manual-biomes/enchanted-biome-seam-long-walk-real-m7.test.mjs
      - name: Real original M7 winding biome walks, native player edit, bounded canopy parity
        run: |
          node --test \
            tests/manual-biomes/enchanted-tree-walking-clearance.test.mjs \
            tests/manual-biomes/enchanted-biome-seam-long-walk-real-m7.test.mjs
