# MYTHWROUGHT isolated original M7 source: optional authentic-biome
# corridor of physical search, keeping FIFO order and actual stepPlayer.
# One focused changed-source native acceptance. Reuse old 9/9 prior
# source acceptance #45109852257, unchanged Moonwillow/WebGL2 and GPU.
# No shared infrastructure, broad CI, deployments or other lane edits.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-m7-corridor-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged accepted source and modified research syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          node --check src/manual-biomes/enchanted-original-physics-route.mjs
          node --check tests/manual-biomes/enchanted-original-physics-corridor-real-m7.test.mjs
      - name: Original M7 corridor physics plus source default/cave safety regression
        run: |
          node --test \
            tests/manual-biomes/enchanted-original-physics-corridor-real-m7.test.mjs \
            tests/manual-biomes/enchanted-original-physics-route-real-m7.test.mjs
