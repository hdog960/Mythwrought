# Exact original-M7 experimental-only 128-entry immutable site metadata cache.
# Scope: original FourRegionWorld streaming generation, cache eviction, actual
# cave/landmark source integrity. Prior 6/6 density tests and earlier Moonwillow
# native/WebGL2 proofs are reused where their tree/renderer source is unchanged.
# No shared workflows, browser runs, broad CI or queue audits.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-world-site-memo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original-world and affected source syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-tree-site-biome-cache.mjs
          node --check src/manual-biomes/environment-v7.mjs
          node --check src/manual-biomes/profile-world.mjs
          node --check tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs
      - name: Source-authentic 192-chunk original-world residency, cave, seam and save proof
        run: |
          node --test \
            tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs \
            tests/manual-biomes/enchanted-tree-physical-census-seams.test.mjs \
            tests/manual-biomes/enchanted-tree-source-cost.test.mjs
