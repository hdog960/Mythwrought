# Standalone Phase 2 experimental tree planner: one targeted original-source
# site-envelope regression. Reuse prior 30/30 native and matched WebGL2
# from #45057456018 for unchanged source; no repeated Chromium or broad CI.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-m7-candidate-site-reach:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and changed test syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/environment-v7.mjs
          node --check tests/manual-biomes/enchanted-tree-source-site-reach.test.mjs
      - name: Actual M7 early-cull byte parity, chunk seams, save and source cost
        run: |
          node --test \
            tests/manual-biomes/enchanted-tree-source-site-reach.test.mjs \
            tests/manual-biomes/enchanted-tree-physical-census-seams.test.mjs \
            tests/manual-biomes/enchanted-tree-source-cost.test.mjs \
            tests/manual-biomes/enchanted-trees-phase2.test.mjs
