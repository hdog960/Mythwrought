# Enchanted Phase 2 isolated original-M7 source-grounded path search only.
# Changed test only: stratified real original-M7 path discovery by climate
# and seed. Prior 2/2 new bounded path source gate #45092293445 passed.
# Reuse prior source/physics evidence; no repeated tests, broad CI or browser.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-real-stratified-climate-pedestrian-survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and narrow original-M7 walking test syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-original-pedestrian-search.mjs
          node --check tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
      - name: Only new original M7 per-climate physical survey
        run: |
          node --test --test-name-pattern="stratified bounded REAL M7" \
            tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
