# EXACT changed-only native recovery. Source is new experimental research
# helper, no changes to original M7 generator/physics, accepted BFS or saves.
# Already accepted seed -88, disposable obstruction and exact four-diagonal
# witness in prior focused runs. Changed only an arbitrary four-leg assertion:
# three original diagonals can genuinely exceed four-block displacement.
# All previous Moonwillow, cache, GPU and WebGL2 work remains reused.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-physics-route-orientation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original source checks
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-original-physics-route.mjs
          node --check tests/manual-biomes/enchanted-original-physics-route-real-m7.test.mjs
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
      - name: Only corrected source-admitted original Enchanted-to-Desert physics route test
        run: |
          node --test --test-name-pattern="original unchanged stepPlayer physically admits" \
            tests/manual-biomes/enchanted-original-physics-route-real-m7.test.mjs
