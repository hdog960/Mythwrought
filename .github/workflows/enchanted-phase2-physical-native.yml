# Changed experimental immutable site-cache canonical-key correction, plus
# authentic extended original-M7 climate boundary walking and player AIR edits.
# Reuse exact previous cache 6/6, Moonwillow native/WebGL2 and 288-chunk
# source proofs where their source bodies are unchanged. No broad CI/browser.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-cross-climate-pedestrian-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original source and affected syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-tree-site-biome-cache.mjs
          node --check tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs
          node --check tests/manual-biomes/enchanted-biome-seam-long-walk-real-m7.test.mjs
      - name: Source-authentic M7 climate border routes, authoritative edits and immutable memo
        run: |
          node --test \
            tests/manual-biomes/enchanted-biome-seam-long-walk-real-m7.test.mjs \
            tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs
