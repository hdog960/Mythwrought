# Only target-directed read-only original-M7 terrain search was changed.
# Reuse previously verified native graph 2/2 #45092293445 and stratified
# per-biome test 1/1 #45092467293. Test seed -88 Plains border with
# actual physics, and preserve earlier Desert route, not broad CI/Chromium.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-directed-pedestrian-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact bounded original-world helper and changed-test syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-original-pedestrian-search.mjs
          node --check tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
      - name: Only new target-directed genuine M7 Plains and Desert traversals
        run: |
          node --test --test-name-pattern="target-directed" \
            tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
