# One NEW source-near original-M7 Plains boundary research test only.
# Previous exact source corridor 8/8 passed Actions #45110157768, and
# prior original physics arrivals 9/9 #45109852257. No duplicate suites,
# Chromium, other developer jobs, deployment or protected branch changes.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-seed88-near-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate accepted original M7 source and focused test syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          node --check tests/manual-biomes/enchanted-original-physics-corridor-real-m7.test.mjs
          node --check src/manual-biomes/enchanted-original-physics-route.mjs
      - name: Only new authentic seed -88 near-seam source standing and stepPlayer
        run: |
          node --test --test-name-pattern="source-near seed -88 Plains boundary surveys" \
            tests/manual-biomes/enchanted-original-physics-corridor-real-m7.test.mjs
