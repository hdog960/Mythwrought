# Non-redundant original-world M7 physical climate survey only.
# Prior exact 12/12 canopy budget and 14-leg winding routes passed on
# source a4799ef8ddb8ce34002ba8fd533f40235188fc05, Actions #45088942632.
# This run executes ONLY the new 8/10-leg multi-climate and seed -88 search.
# No broad CI, unchanged tests, browsers or other developer workflows.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-short-multiclimate-traversal-survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and one new changed-test syntax
        run: |
          git rev-parse HEAD
          node --check tests/manual-biomes/enchanted-biome-seam-long-walk-real-m7.test.mjs
      - name: One new real original M7 short climate transition survey only
        run: |
          node --test --test-name-pattern="bounded short original-M7 physical survey" \
            tests/manual-biomes/enchanted-biome-seam-long-walk-real-m7.test.mjs
