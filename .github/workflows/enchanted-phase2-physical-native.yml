# MYTHWROUGHT Enchanted Phase 2 isolated original-M7 physics-state research.
# Only one changed source: optional bounded two-incoming-heading admission,
# default historical single arrival preserved. Two focused test files only.
# Reuse accepted unchanged geometric BFS, tree/GPU, Moonwillow WebGL2.
# Never merge, deploy, alter shared infrastructure, or cancel other CI.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-bounded-arrival-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original-M7 protected source and changed files
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          node --check src/manual-biomes/enchanted-original-physics-route.mjs
          node --check tests/manual-biomes/enchanted-original-physics-route-real-m7.test.mjs
          node --check tests/manual-biomes/enchanted-original-physics-arrival-state-real-m7.test.mjs
      - name: Genuine original-world per-edge arrivals, prior Desert witnesses, seed -88 and cave AIR
        run: |
          node --test \
            tests/manual-biomes/enchanted-original-physics-route-real-m7.test.mjs \
            tests/manual-biomes/enchanted-original-physics-arrival-state-real-m7.test.mjs
