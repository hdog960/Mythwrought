# MYTHWROUGHT Enchanted Phase 2 source-owned, read-only original-M7
# standing diagnostics and physically replayed legacy-ground traversal.
# New opt-in groundMode=physical only, original mode remains unchanged.
# Focus ONLY two tests in newly added source test file; reuse previously
# accepted source/cave/Moonwillow/physics runs. No broad CI/Chromium.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-physical-grass-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate unchanged accepted research BFS and source syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          node --check src/manual-biomes/enchanted-original-standing-diagnostic.mjs
          node --check src/manual-biomes/enchanted-original-physics-route.mjs
          node --check tests/manual-biomes/enchanted-original-physical-ground-crossing-real-m7.test.mjs
      - name: Only new east-side original M7 physical route and default Desert parity
        run: |
          node --test --test-name-pattern="real east-side|new physical source is opt-in" \
            tests/manual-biomes/enchanted-original-physical-ground-crossing-real-m7.test.mjs
