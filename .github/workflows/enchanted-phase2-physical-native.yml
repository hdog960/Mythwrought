# Enchanted Phase 2 isolated original-M7 source-grounded path search only.
# One new read-only bounded AABB source-path helper and its original real
# stepPlayer admission tests. Reuse #45088942632 and #45089099828:
# no repeated unchanged legacy tests, browser galleries or broad CI.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-real-bounded-pedestrian-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and narrow original-M7 walking test syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-original-pedestrian-search.mjs
          node --check tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
      - name: Only changed source-real bounded climate pedestrian admission
        run: node --test tests/manual-biomes/enchanted-original-pedestrian-search-real-m7.test.mjs
