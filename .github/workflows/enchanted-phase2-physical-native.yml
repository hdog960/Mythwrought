# Exact original-M7 isolated candidate immutable-site cache hardening.
# Only affected real-world biome-cache, source safety, walking and measured
# 128-chunk AB/BA cost tests. Reuse unchanged original three-species WebGL2,
# 288-chunk density and native GPU evidence. No duplicate broad CI.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-immutable-site-and-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact changed source and focused tests syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-tree-site-biome-cache.mjs
          node --check src/manual-biomes/profile-world.mjs
          node --check tests/manual-biomes/enchanted-site-biome-controlled-cost-real-m7.test.mjs
          node --check tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs
      - name: Run original-world cache safety, controlled cost and real pedestrian acceptance
        run: |
          node --test \
            tests/manual-biomes/enchanted-site-biome-controlled-cost-real-m7.test.mjs \
            tests/manual-biomes/enchanted-site-biome-stream-real-m7.test.mjs \
            tests/manual-biomes/enchanted-tree-multistep-diagonal-real-m7.test.mjs
