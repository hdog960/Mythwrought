# Isolated Phase 2 original-M7 source classification ONLY.
# The exact 52 rejected near-Plains original source positions are diagnosed
# with a read-only helper, alongside certified original standing references.
# Reuse native #45109852257 (9/9), #45110157768 (8/8), #45110354373 (1/1).
# No production/physics/cave changes, broad CI, Chromium, other jobs.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-52-standing-source-causes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original BFS unchanged and exact diagnostic syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          node --check src/manual-biomes/enchanted-original-standing-diagnostic.mjs
          node --check tests/manual-biomes/enchanted-original-standing-diagnostic-real-m7.test.mjs
      - name: Classify 52 original-M7 rejection guards and native surface provenance
        run: |
          node --test tests/manual-biomes/enchanted-original-standing-diagnostic-real-m7.test.mjs
