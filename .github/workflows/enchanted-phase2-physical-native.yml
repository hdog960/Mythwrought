# ENCHANTED PHASE 2: isolated original source, physics per-edge admission.
# Only new source and its tests. Reuse accepted old BFS #45093229883,
# Moonwillow native/WebGL2, 288-chunk voxel and cache source evidence.
# No broad suite, other developer workflows, Chromium or deployment.
name: Enchanted Phase 2 Physical Root and Seam Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-physical-root-safety-20261121
    paths:
      - .github/workflows/enchanted-phase2-physical-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-m7-per-edge-physics-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact unchanged M7 and new source syntax
        run: |
          git rev-parse HEAD
          node --check src/manual-biomes/enchanted-original-physics-route.mjs
          node --check tests/manual-biomes/enchanted-original-physics-route-real-m7.test.mjs
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
      - name: Source-authentic original M7 per-edge physics routes and capped seed -88
        run: node --test tests/manual-biomes/enchanted-original-physics-route-real-m7.test.mjs
