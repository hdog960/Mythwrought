name: Unified actual Creative legacy and multi-cell voxel history
on:
  push:
    branches: [probe/unified-creative-voxel-history-ui-20261126]
    paths: ['tests/creative-integration/creative-voxel-history-browser.mjs','.github/workflows/unified-creative-voxel-history-browser.yml']
permissions:
  contents: read
jobs:
  actual-source-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact previously native-qualified source
        run: |
          test "$(git rev-parse HEAD^)" = 3ab9f2616f4e6ac1ec0b64e857e782d9dc2a354b
          test -z "$(git diff HEAD^ HEAD -- src index.html styles.css sw-m5.js sw-nonblock-stage.js nonblock-stage-assets.json)"
          node --check tests/creative-integration/creative-voxel-history-browser.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Actual historical saved voxel and natural V8 support batch UI
        run: |
          python3 -m http.server 4174 >/tmp/creative-history.log 2>&1 &
          node tests/creative-integration/creative-voxel-history-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-creative-actual-voxel-history
          path: artifacts/creative-voxel-history/
          if-no-files-found: warn
