name: MYTHWROUGHT Builder B homes and hospitality exact-head source acceptance
on:
  pull_request:
    paths:
      - 'src/building-pool/roadmap-1a/builder-b-*'
      - 'tests/building-pool/roadmap-1a/builder-b-*'
      - 'tests/building-pool/roadmap-1a/audit-builder-b-current-wave.mjs'
      - 'docs/building-pool/roadmap-b/**'
      - '.github/workflows/roadmap-b-homes-source-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mythwrought-builder-b-homes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-and-authentic-chromium:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact source HEAD, not synthetic PR merge checkout
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$BUILDER_B_EXPECTED_HEAD"
      - name: Parse every Builder B native and screenshot audit module before starting expensive historical source tests
        run: |
          find tests/building-pool/roadmap-1a -maxdepth 1 -type f \\( -name 'builder-b-*.test.mjs' -o -name 'audit-builder-b-*.mjs' \\) -print -exec node --check {} \\;
      - name: Run genuine original 1A historical uniqueness, native source and physical producer audits
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-1a/builder-b-homes-wave1.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-hospitality-wave2.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-inns-wave3.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-homes-wave4.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-hospitality-wave5.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-preview-wiring.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-homes-wave6.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-native-import-contract.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-evidence-count-contract.test.mjs \
            tests/building-pool/roadmap-1a/builder-b-homes-wave7.test.mjs
      - name: Require actual system Chromium
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
      - name: Install exact PNG decoder for independent CRC audit only
        run: npm install --no-save --no-audit --no-fund pngjs@7.0.0
      - name: Run true source WebGL2 and Pack1-5 visible-AABB Chromium captures
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test tests/building-pool/roadmap-1a/builder-b-current-wave-webgl2.test.mjs
      - name: Independently verify all 60 PNGs' CRC SHA dimensions, original IDs, and source checkout
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-1a/audit-builder-b-current-wave.mjs
      - name: Capture six genuine Granitebell original WebGL2 + six genuine Pack-visible-AABB frames
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test tests/building-pool/roadmap-1a/builder-b-homes-wave4-webgl2.test.mjs
      - name: Independently CRC/SHA audit all 12 exact-head Granitebell images
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-1a/audit-builder-b-homes-wave4.mjs
      - name: Capture Foxglade inn exact-source WebGL2 and Pack-visible-AABB in all three sizes
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test tests/building-pool/roadmap-1a/builder-b-hospitality-wave5-webgl2.test.mjs
      - name: Independently CRC SHA verify 12 real Foxglade source/Pack AABB PNGs
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-1a/audit-builder-b-hospitality-wave5.mjs
      - name: Capture genuine Willowmere source and Pack visible AABB Chromium frames across 3 landscape sizes
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test tests/building-pool/roadmap-1a/builder-b-homes-wave6-webgl2.test.mjs
      - name: Independently verify source and visible AABB Willowmere screenshot CRC SHA and exact source HEAD
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-1a/audit-builder-b-homes-wave6.mjs
      - name: Capture 12 authentic Highglen 667/844/932 original source and Pack AABB PNGs
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test tests/building-pool/roadmap-1a/builder-b-homes-wave7-webgl2.test.mjs
      - name: Independently verify Highglen source-only PNG CRC SHA exact repository/renderer identity
        env:
          BUILDER_B_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tests/building-pool/roadmap-1a/audit-builder-b-homes-wave7.mjs
      - name: Preserve actual source-only PNG and audit evidence, no creator art approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-b-homes-nine-originals-108-genuine-chromium-pngs
          path: |
            artifacts/builder-b-housing-five-originals/
            artifacts/builder-b-housing-wave4-single-original/
            artifacts/builder-b-hospitality-wave5-foxglade/
            artifacts/builder-b-homes-wave6-willowmere/
            artifacts/builder-b-homes-wave7-highglen/
          if-no-files-found: ignore
