# Isolated changed-only original-world cave-mouth evidence. No cave
# generation edits, migrations, game runtime or unrelated developer CI.
name: Enchanted Phase 2 Authored M7 Cave Mouth Native (isolated)
on:
  push:
    branches:
      - research/enchanted-p2-authored-mouth-gates-20261123
    paths:
      - .github/workflows/enchanted-phase2-authored-mouth-native.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  original-m7-authored-mouth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged accepted physical-source owners and new syntax
        id: guards
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/manual-biomes/enchanted-original-pedestrian-search.mjs)" = "49fa84146656d895638126c7766675188a13fa80"
          test "$(git hash-object src/manual-biomes/enchanted-original-standing-diagnostic.mjs)" = "f9c9b7fc300cf9ea3a04d2cf54fecb3ce1ee8fb7"
          test "$(git hash-object src/manual-biomes/enchanted-original-physics-route.mjs)" = "21f368cc0532a124e7d2ba0f3e55548386c2682f"
          test "$(git hash-object src/manual-biomes/enchanted-original-route-evidence.mjs)" = "9511e0a3709812f24f26edeb011fb105ec44a434"
          node --check src/manual-biomes/enchanted-original-authored-mouth-audit.mjs
          node --check tests/manual-biomes/enchanted-original-authored-mouth-real-m7.test.mjs
          node --check src/manual-biomes/enchanted-original-physics-tick-trace.mjs
          node --check tests/manual-biomes/enchanted-original-physics-tick-trace-real-m7.test.mjs
      - name: Only four new original M7 source/physics test bodies
        id: native
        run: |
          node --test \
            tests/manual-biomes/enchanted-original-authored-mouth-real-m7.test.mjs \
            tests/manual-biomes/enchanted-original-physics-tick-trace-real-m7.test.mjs
      - name: Publish exact native result and GitHub Actions run locator on isolated commit
        if: always()
        env:
          AUTH_TOKEN: ${{ github.token }}
          GUARD_OUTCOME: ${{ steps.guards.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          if [ "$GUARD_OUTCOME" = "success" ] && [ "$NATIVE_OUTCOME" = "success" ]; then
            export NATIVE_STATUS=success
            export NATIVE_DESCRIPTION="4/4 targeted original M7 mouth/tick source tests passed"
          else
            export NATIVE_STATUS=failure
            export NATIVE_DESCRIPTION="Targeted original M7 source tests or hash guards failed"
          fi
          python3 - <<'PY' >/tmp/enchanted-p2-native-status.json
          import json,os
          print(json.dumps({
            "state":os.environ["NATIVE_STATUS"],
            "context":"enchanted-p2-authored-mouth-tick-native",
            "description":os.environ["NATIVE_DESCRIPTION"],
            "target_url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+
              "/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          }))
          PY
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/enchanted-p2-native-status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
