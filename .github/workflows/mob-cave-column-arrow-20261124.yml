name: Mob changed cave births and arrow WebGL2
on:
  push:
    branches:
      - qualification/mob-cave-column-arrow-20261124
    paths:
      - '.github/workflows/mob-cave-column-arrow-20261124.yml'
permissions:
  contents: read
jobs:
  cave-and-arrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Authenticate exact changed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git checkout --detach 8aaedc5b3d4b7b4fc91f1599b22a5c2ee1f09a61
          test "$(git rev-parse HEAD^{tree})" = c32177077ea3db61481f713e30945ebe5ee862ad
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git hash-object src/mobs/cave-spawn-column.mjs)" = b669e567a1b45f59cffa53c481c53b8d5ff79e8c
          test "$(git hash-object src/mobs/ecology.mjs)" = a51bb7ccdcb948893c0d9486195ed3a563f34f01
          test "$(git hash-object mob-preview/hostile-models.mjs)" = d7edf8b97b0f760f30795f364840562b5994112f
          test "$(git hash-object tests/mob-ecosystem-cave-column-actual-births.test.mjs)" = 2964709c7f2397e29fa504689e0ebdea96f7c498
          test "$(git hash-object tests/mob-ecosystem-projectile-webgl2-browser.mjs)" = e25ae2e5860d74f16a9c5594ae7a72e7f43991b2
          node --version
          git rev-parse HEAD HEAD^{tree}
      - name: Actual changed-source four-site cave births
        run: |
          set -o pipefail
          mkdir -p artifacts/mob-cave-column-native
          node --test tests/mob-ecosystem-cave-column-actual-births.test.mjs | tee artifacts/mob-cave-column-native/cave-births.tap
      - name: Install pinned Chromium
        if: success() || failure()
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Actual changed-arrow WebGL2 three-viewport gate
        if: success() || failure()
        run: node tests/mob-ecosystem-projectile-webgl2-browser.mjs
      - name: Print evidence
        if: always()
        run: |
          if [ -f artifacts/mob-cave-column-native/cave-births.tap ]; then sha256sum artifacts/mob-cave-column-native/cave-births.tap; fi
          if [ -f artifacts/mob-projectile-webgl2/report.json ]; then cat artifacts/mob-projectile-webgl2/report.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mob-cave-column-arrow-8aaedc5b
          path: |
            artifacts/mob-cave-column-native/
            artifacts/mob-projectile-webgl2/
          if-no-files-found: error
          retention-days: 14
