name: Builder D52 isolated authentic exterior dogleg endcap ONLY
on:
  push:
    branches:
      - builder-d-d52-original-exterior-terminal-isolated-20261125
    paths:
      - 'src/building-pool/roadmap-d/d52-*'
      - 'tests/building-pool/roadmap-d/d52-*'
      - 'docs/building-pool/roadmap-d/D52_*'
      - '.github/workflows/roadmap-d-d52-original-exterior-terminal.yml'
permissions:
  contents: read
concurrency:
  group: builder-d-d52-new-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  only-new-d52-real-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Authenticate exact D51 parent and untouched original source/owner blobs
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '461a95b7ae2b56514ced547aab9d70cc6700e38b'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave16.mjs)" = 'da58c75008bbc286d2512ac8c47ee6b44b6f822d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave17.mjs)" = 'efa2763a2ad40fe2df5179c1138b3e56732b3031'
          test "$(git rev-parse HEAD:src/block-packs/pack-2/definitions.mjs)" = 'f9583417467c991674e5a1bd8c14b9b2816a58f9'
          test "$(git rev-parse HEAD:src/voxel.mjs)" = 'beaa7c9de60e6326128357c9dd3a498a154f255a'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d36-wall-socket-convex-preview.mjs)" = 'b5f96c7b0bf6bd7cae14e7fce85ca05c8fdfb0ba'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d45-source-blocker-and-face-egress.mjs)" = 'ace6bbb9cfb21907570b81c8462c8f316f5ee44b'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d47-original-congruent-socket-saddle.mjs)" = 'a45e05cd56d3040cfd5211469caabed267075afd'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d48-original-saddle-patches-and-bridge.mjs)" = '354933307cc9a333587b54af42ddfc3cc4e8a8f8'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d51-articulated-true-endface-link.mjs)" = '319c91ac400ce9c9aec862904e1dde7e41551e40'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d51-original-rotated-endface-audit.mjs)" = '5dd4c18e304cfee5afa91092f0878309dc376fe3'
          git diff --name-only HEAD^ HEAD > /tmp/d52-actual
          printf '%s\n' \
            '.github/workflows/roadmap-d-d52-original-exterior-terminal.yml' \
            'docs/building-pool/roadmap-d/D52_TRUE_EXTERIOR_DOGLEG_ENDCAP_FOUR_STAGE_SOURCE_GATE.md' \
            'src/building-pool/roadmap-d/d52-exterior-terminal-approach.mjs' \
            'src/building-pool/roadmap-d/d52-original-exterior-terminal-audit.mjs' \
            'tests/building-pool/roadmap-d/d52-exterior-dogleg.pure.test.mjs' \
            'tests/building-pool/roadmap-d/d52-original-exterior.source.test.mjs' > /tmp/d52-expected
          diff -u /tmp/d52-expected /tmp/d52-actual
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check only four new D52 modules
        run: |
          node --check src/building-pool/roadmap-d/d52-exterior-terminal-approach.mjs
          node --check src/building-pool/roadmap-d/d52-original-exterior-terminal-audit.mjs
          node --check tests/building-pool/roadmap-d/d52-exterior-dogleg.pure.test.mjs
          node --check tests/building-pool/roadmap-d/d52-original-exterior.source.test.mjs
      - name: Run only new D52 four focused and two original W16-W17 tests
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-d/d52-exterior-dogleg.pure.test.mjs \
            tests/building-pool/roadmap-d/d52-original-exterior.source.test.mjs
