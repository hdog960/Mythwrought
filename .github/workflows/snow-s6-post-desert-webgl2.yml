name: Snow S6 pinned Desert-main genuine WebGL2 and edited glacier parity
on:
  push:
    branches:
      - research/snow-s6-post-desert-956-original-webgl2-isolated-20261123
    paths:
      - '.github/workflows/snow-s6-post-desert-webgl2.yml'
      - 'scripts/ci/snow-s6-post-desert-main-real-webgl2.mjs'
permissions:
  contents: read
concurrency:
  group: snow-s6-post-desert-956-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-production-pin-browser-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Checkout independent exact Desert release in temporary sibling folder
        uses: actions/checkout@v4
        with:
          ref: db4bbcc32156e5df311f733bcaa53d559c17313b
          path: production-readonly
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict Snow and newer production source identities
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C production-readonly rev-parse HEAD)" = db4bbcc32156e5df311f733bcaa53d559c17313b
          node --check scripts/ci/snow-s6-post-desert-main-real-webgl2.mjs
          node --check src/manual-biomes/snowy-s6-winter-tone-proposal.mjs
          node --check production-readonly/src/voxel.mjs
          test -f production-readonly/src/main.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Install only pinned free browser + PNG decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Exact real game two seeds 956x440 and source-player-edited ice mesh parity
        run: |
          python3 -m http.server 4173 --directory production-readonly >/tmp/snow-s6-production-test.log 2>&1 &
          node scripts/ci/snow-s6-post-desert-main-real-webgl2.mjs
          test -z "$(git -C production-readonly status --porcelain)"
      - name: Publish only test PNG and SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-s6-post-desert-956-real-webgl2-${{ github.sha }}
          path: artifacts/snow-s6-post-desert-real-webgl2/
          retention-days: 7
          if-no-files-found: ignore
