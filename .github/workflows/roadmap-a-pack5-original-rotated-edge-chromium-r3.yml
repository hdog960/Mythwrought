name: Roadmap A original Pack5 rare real-game triangle-only edge R3
on:
  push:
    branches:
      - roadmap-a-pack5-original-rotated-edge-chromium-r3-20261122
    paths:
      - '.github/workflows/roadmap-a-pack5-original-rotated-edge-chromium-r3.yml'
permissions:
  contents: read
jobs:
  original-disposable-exact-triangle-only-ray:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Only changed exact rare-edge witness collection native preflight
        run: |
          node --check tests/building-pool/roadmap-2a/roadmap-a-pack5-original-game-rotated-edge-browser.mjs
          node --test tests/building-pool/roadmap-2a/roadmap-a-pack5-original-game-rotated-edge-preflight.test.mjs
      - name: Free original previously verified Chromium and PNG parser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Exactly one original game private yaw2 brick real edge/pixel and MINE truth test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: 'x11'
        run: node tests/building-pool/roadmap-2a/roadmap-a-pack5-original-game-rotated-edge-browser.mjs artifacts/roadmap-a-pack5-actual-yaw2-edge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-a-original-pack5-rotated-triangle-only-r3-real-pixels
          path: artifacts/roadmap-a-pack5-actual-yaw2-edge/
          if-no-files-found: warn
          retention-days: 14
