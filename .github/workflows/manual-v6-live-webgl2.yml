name: Manual V6 Real Five-Biome WebGL2 + Offline Acceptance (draft only)

on:
  pull_request:
    paths:
      - 'src/main.mjs'
      - 'src/manual-biomes/**'
      - 'sw-m5.js'
      - 'scripts/ci/manual-v6-live-webgl2.mjs'
      - '.github/workflows/manual-v6-live-webgl2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6-real-world-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native V6 world and real Chromium proof scripts
        run: |
          node --check scripts/ci/manual-v6-live-webgl2.mjs
          node --check src/manual-biomes/v6-balanced-biomes.mjs
          node --check src/manual-biomes/profile-world.mjs
          node --check src/main.mjs
          node --check sw-m5.js
      - name: Install pinned Chromium and real PNG decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Prove real-five-biome Chromium rendering and network-disabled cold reload
        run: node scripts/ci/manual-v6-live-webgl2.mjs
      - name: Preserve genuine screenshots, manifests and failure witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythwrought-v6-real-webgl2-five-biomes
          path: artifacts/manual-v6-live/
          if-no-files-found: warn
          retention-days: 14
