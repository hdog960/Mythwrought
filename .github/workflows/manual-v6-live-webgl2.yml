name: Manual V6 Real Five-Biome WebGL2 + Offline Acceptance (draft only)

on:
  pull_request:
    paths:
      - 'src/main.mjs'
      - 'src/manual-biomes/**'
      - 'sw-m5.js'
      - 'scripts/ci/manual-v6-live-webgl2.mjs'
      - '.github/workflows/manual-v6-live-webgl2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6-real-world-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native V6 world and real Chromium proof scripts
        run: |
          node --check scripts/ci/manual-v6-live-webgl2.mjs
          node --check src/manual-biomes/v6-balanced-biomes.mjs
          node --check src/manual-biomes/profile-world.mjs
          node --check src/main.mjs
          node --check sw-m5.js
      - name: Install pinned Chromium and real PNG decoder
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Prove real-five-biome Chromium rendering and network-disabled cold reload
        run: node scripts/ci/manual-v6-live-webgl2.mjs
      - name: Preserve genuine screenshots, manifests and failure witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythwrought-v6-real-webgl2-five-biomes
          path: artifacts/manual-v6-live/
          if-no-files-found: warn
          retention-days: 14
      - name: Prove recorder survives V6 integration with native and genuine WebGL2 moving video
        run: |
          node --test tests/gameplay-recorder.test.mjs
          python3 -m http.server 4173 >/tmp/mythwrought-v6-recorder.log 2>&1 &
          node tests/gameplay-recorder-browser.mjs
      - name: Preserve real recorder compatibility screenshot and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythwrought-v6-recorder-compatibility
          path: artifacts/gameplay-recorder/
          if-no-files-found: warn
          retention-days: 14

  live-original-game-40-creature-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-head native 40-species and independent schema-1 save checks
        run: |
          node --check src/main.mjs
          node --check src/mobs/live-render.mjs
          node --check src/mobs/live-game.mjs
          node --check tests/live-five-system-mobs-browser.mjs
          node --test tests/live-five-system-mobs.test.mjs
          node --test tests/mobs/full-roster.test.mjs
          node --test tests/mobs/roster-persistence.test.mjs
      - name: Install real WebGL2 Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Verify forty real-game creature meshes at three phone sizes
        run: node tests/live-five-system-mobs-browser.mjs
      - name: Preserve genuine 120 source-authentic PNGs and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythwrought-unified-actual-game-40-mobs
          path: artifacts/five-systems-live-mobs/
          if-no-files-found: warn
          retention-days: 14

  deep-cave-real-sky-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CAVE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict native cave 4-GPU source budget and real voxel seam tests
        run: |
          node --check src/manual-caves/c6-far-wall-gpu.mjs
          node --test tests/cave-roadmap-far-wall-gpu.test.mjs
      - name: Install real WebGL2 Chromium and PNG inspector
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Reject real sky leak in all named and secondary original-game cave scenes
        run: node tests/cave-roadmap-in-game-browser.mjs
      - name: Preserve original-game cave screenshot/ray source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythwrought-unified-actual-game-cave-source-rays
          path: artifacts/cave-roadmap-actual-game/
          if-no-files-found: warn
          retention-days: 14
