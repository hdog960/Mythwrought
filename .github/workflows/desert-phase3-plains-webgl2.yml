name: Desert P3 focused real Plains seam WebGL2 (test-only)
on:
  push:
    branches:
      - probe/desert-phase3-plains-2scene-webgl2-20261122
  workflow_dispatch:

# This test-only probe tests the exact isolated Phase 3 source only. It never
# runs on production main and never deploys or merges anything.
permissions:
  contents: read

concurrency:
  group: desert-p3-plains-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-authentic-two-scene-plains-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native strict Desert multi-seed boundary and world-reader census
        run: |
          node --check scripts/ci/desert-phase3-plains-webgl2.mjs
          node --test tests/desert-phase3-plains-shoulder.test.mjs tests/desert-grass-shoulder-phase2.test.mjs
      - name: Install pinned real Chromium WebGL2 runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Real original-game two-seed four-border visual proof
        run: |
          python3 -m http.server 4173 > /tmp/desert-v7-proof-site.log 2>&1 &
          site_server=$!
          trap 'kill "$site_server" 2>/dev/null || true' EXIT
          node scripts/ci/desert-phase3-plains-webgl2.mjs
      - name: Upload source-authenticated PNGs, SHA256 and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desert-p3-v7-exact-source-two-plains-borders
          path: artifacts/desert-phase3-plains-visual/
          if-no-files-found: warn
