name: Prepare exact physical mining Cloudflare upload (no deploy)
on:
  push:
    branches: [probe/unified-physical-mining-upload-20261126]
    paths: ['perf/issue-291/physical-mining-package.mjs','.github/workflows/unified-physical-mining-upload.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Produce exact origin-locked static ZIP, never publish
        run: |
          node perf/issue-291/physical-mining-package.mjs https://mythwrought-mining-diagnostic-hdog960.pages.dev artifacts/physical-mining-package
          python3 - <<'PY'
          import pathlib, json, hashlib, zipfile
          root=pathlib.Path('artifacts/physical-mining-package')
          ledger=json.loads((root/'diagnostic-assets.json').read_text())
          expected=set(ledger['assets'])|{'diagnostic-assets.json'}
          paths={p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
          assert set(paths)==expected
          assert len(paths)<=1000
          assert max(p.stat().st_size for p in paths.values())<=25*1024*1024
          assert ledger['allowedOrigin']=='https://mythwrought-mining-diagnostic-hdog960.pages.dev'
          assert ledger['source']=='d365635eef84a87a273b53f39d75f7b875f11837'
          assert ledger['published'] is False
          assert not any(p.startswith('sw-') or p=='manifest.webmanifest' for p in paths)
          target=pathlib.Path('artifacts/mythwrought-mining-diagnostic.zip')
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for name,p in sorted(paths.items()):
                  b=p.read_bytes()
                  if name in ledger['assets']: assert hashlib.sha256(b).hexdigest()==ledger['assets'][name]
                  z.writestr(name,b)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert set(z.namelist())==expected
          print('UPLOAD ZIP',len(paths),'files',target.stat().st_size,'bytes',hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mythwrought-mining-diagnostic-upload
          path: artifacts/mythwrought-mining-diagnostic.zip
          if-no-files-found: error
