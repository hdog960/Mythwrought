name: Roadmap A original Pack5 camera warning forensics native
on:
  push:
    branches:
      - roadmap-a-pack5-warning-forensics-native-ci-20261122
    paths:
      - '.github/workflows/roadmap-a-pack5-warning-forensics-native-ci.yml'
permissions:
  contents: read
jobs:
  original-pack5-12-camera-warnings:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check only new original source forensic producer and native test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-pack5-camera-warning-forensics-producer.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-pack5-camera-warning-forensics.test.mjs
      - name: Only new original Pack5 selection warning classification tests
        run: node --test tests/building-pool/roadmap-2a/roadmap-a-pack5-camera-warning-forensics.test.mjs
