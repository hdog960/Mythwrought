name: Original integrated opaque front-to-back draw pixel and GPU cost (NO RELEASE)
on:
  push:
    branches:
      - probe/iphone-opaque-front-to-back-291-20261121
permissions:
  contents: read
jobs:
  original-source-opaque-order-pixels-and-latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert current original integrated parent and no modified source
        run: |
          test "$(git rev-parse HEAD^)" = "7016e14cd6289f45eaf7fc6a79a362b47996df65"
          git diff --exit-code 7016e14cd6289f45eaf7fc6a79a362b47996df65 HEAD -- src/ index.html styles.css sw-m5.js tests/
          node --check scripts/ci/iphone-opaque-front-to-back.mjs
      - name: Install original Chromium WebGL2 and PNG comparator
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Original source as-is vs test-only opaque draw ordering
        run: |
          python3 -m http.server 4173 --directory . >/tmp/mw-opaque-order.log 2>&1 &
          node scripts/ci/iphone-opaque-front-to-back.mjs
      - name: Upload authentic screenshots and all original edit timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-main-opaque-nearest-first-source-visual-proof
          path: artifacts/iphone-opaque-front-to-back/
          if-no-files-found: warn
          retention-days: 14
