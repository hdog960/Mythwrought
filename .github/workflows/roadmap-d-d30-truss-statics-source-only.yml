name: Builder D30 genuine original underslung truss normalized statics (isolated source-only)
on:
  push:
    branches:
      - builder-d-d30-underslung-truss-isolated-20261122
    paths:
      - 'src/building-pool/roadmap-d/d30-*.mjs'
      - 'tests/building-pool/roadmap-d/d30-*.test.mjs'
      - '.github/workflows/roadmap-d-d30-truss-statics-source-only.yml'
permissions:
  contents: read
concurrency:
  group: builder-d30-${{ github.ref }}
  cancel-in-progress: false
jobs:
  narrow-literal-source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Exact D29 parent plus immutable original W16 W17 and source architects
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '722c4f51d89de4c45655599bc1f7db44f8a9ab50'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave16.mjs)" = 'da58c75008bbc286d2512ac8c47ee6b44b6f822d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave17.mjs)" = 'efa2763a2ad40fe2df5179c1138b3e56732b3031'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d28-original-long-bay-architect.mjs)" = '523ec04f36aad72f75d13602b52ce64b1c839a71'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d29-original-upper-chord-perimeter-audit.mjs)" = '513d622e79a6b58b037a0810bac0d26b1679330b'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-4b/m2-distinctive.mjs)" = '4a3bddd06d4d8d91f65279649c7545661c81729d'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax only four new D30 source/test modules
        run: |
          for f in src/building-pool/roadmap-d/d30-*.mjs tests/building-pool/roadmap-d/d30-*.test.mjs; do
            node --check "$f"
          done
      - name: Run only NEW D30 normalized statics, safety and genuine original-source tests
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-d/d30-idealized-pin-truss-statics.pure.test.mjs \
            tests/building-pool/roadmap-d/d30-original-underslung-truss.pure.test.mjs \
            tests/building-pool/roadmap-d/d30-original-underslung-truss.source.test.mjs
