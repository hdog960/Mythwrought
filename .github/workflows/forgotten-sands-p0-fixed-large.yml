name: Forgotten Sands P0 fixed large and exterior walk native
on:
  push:
    branches: [research/forgotten-sands-p0-colossal-search-20261123]
    paths:
      - 'src/manual-biomes/forgotten-sands-approach-probe.mjs'
      - 'tests/forgotten-sands-fixed-large.test.mjs'
      - '.github/workflows/forgotten-sands-p0-fixed-large.yml'
permissions:
  contents: read
jobs:
  native-fixed-large:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node --check src/manual-biomes/forgotten-sands-approach-probe.mjs
          node --check tests/forgotten-sands-fixed-large.test.mjs
          node --test tests/forgotten-sands-fixed-large.test.mjs
