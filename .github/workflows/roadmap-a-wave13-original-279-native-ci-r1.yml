name: Roadmap A Wave13 original source twelve commerce plans and 279 provenance R1
on:
  push:
    branches:
      - roadmap-a-wave13-original-279-native-ci-r1-20261123
    paths:
      - '.github/workflows/roadmap-a-wave13-original-279-native-ci-r1.yml'
permissions:
  contents: read
jobs:
  original-wave13-279-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Only new Wave13 source, provenance and focused test syntax
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-wave13.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-279-provisional.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave13.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-279-provisional.test.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave13-protected-128-only-d4.test.mjs
      - name: Nine new source tests only original floor-courtyard-vault, 267 record identity and new-only historical128 D4
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-wave13.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-a5-279-provisional.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-wave13-protected-128-only-d4.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave13-279-original-source-provenance-r1
          path: artifacts/roadmap-a-a5/A5_SETTLEMENT_HANDOFF_279_PROVISIONAL.json
          if-no-files-found: error
          retention-days: 14
