name: Enchanted P2 Original Upper Step114 Floor Provenance
on:
  push:
    branches:
      - research/enchanted-p2-deep-band-chamber-upper-20261123
    paths:
      - .github/workflows/enchanted-p2-upper114-original-source-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-upper-source-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original upper author unchanged and exact new syntax
        run: |
          git rev-parse HEAD
          test "$(git hash-object src/physics.mjs)" = "199cab89fc1e6ab67d12a56c62795ef0ac4b50d7"
          test "$(git hash-object src/cave-approaches/upper-network.mjs)" = "a48bd919685b326f062ffa1c5856fa27c2619be8"
          node --check src/manual-biomes/enchanted-original-upper-overlap-diagnostic.mjs
          node --check tests/manual-biomes/enchanted-original-upper-step114-source-real-m7.test.mjs
      - name: Only NEW original upper source overlapping floor evidence
        run: node --test tests/manual-biomes/enchanted-original-upper-step114-source-real-m7.test.mjs
