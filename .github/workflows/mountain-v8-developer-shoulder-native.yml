name: Mountain V8 actual shoulder transition and terrain rendering
on:
  push:
    branches: [mountain-v8-developer-integration-20261124]
    paths: [.github/workflows/mountain-v8-developer-shoulder-native.yml]
permissions:
  contents: read
jobs:
  shoulder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: previous
          ref: 9fe5acdb6f38c3cc9727d07df28949f38fc6158d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and five new transition regression cases
        run: |
          node --version
          git -C candidate rev-parse HEAD
          git -C previous rev-parse HEAD
          test "$(git -C previous rev-parse HEAD)" = 9fe5acdb6f38c3cc9727d07df28949f38fc6158d
          node --check candidate/src/manual-biomes/mountain-v8-runtime-terrain.mjs
          node --check candidate/src/manual-biomes/profile-world.mjs
          node --check candidate/src/voxel.mjs
          export MOUNTAIN_V8_PREVIOUS_ROOT="$GITHUB_WORKSPACE/previous"
          node --test --test-concurrency=1 candidate/tests/mountain-v8-developer-shoulder-native.test.mjs
