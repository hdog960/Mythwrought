name: Builder D43 isolated authentic original independent exterior footing source diagnostic
on:
  push:
    branches:
      - builder-d-d43-original-outboard-foundation-diagnostic-isolated-20261123
    paths:
      - 'src/building-pool/roadmap-d/d43-*'
      - 'tests/building-pool/roadmap-d/d43-*'
      - 'docs/building-pool/roadmap-d/D43_*'
      - '.github/workflows/roadmap-d-d43-original-outboard-source.yml'
permissions:
  contents: read
concurrency:
  group: builder-d-d43-source-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  new-d43-exact-original-source-tests-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify D42 parent and byte-for-byte original owner and builder sources
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '79d30ba861de47ba0ad5f2974f78eec419849fe3'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave16.mjs)" = 'da58c75008bbc286d2512ac8c47ee6b44b6f822d'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d1-original-institutions-wave17.mjs)" = 'efa2763a2ad40fe2df5179c1138b3e56732b3031'
          test "$(git rev-parse HEAD:src/block-packs/pack-2/definitions.mjs)" = 'f9583417467c991674e5a1bd8c14b9b2816a58f9'
          test "$(git rev-parse HEAD:src/voxel.mjs)" = 'beaa7c9de60e6326128357c9dd3a498a154f255a'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d40-swept-exterior-capture.mjs)" = '172284f5f5eb1727b6d510159afdc992cfd5f0da'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d42-root-barrier-witness.mjs)" = 'df1e722f366bbc9b1fa5d24aa42901c5f15c2f84'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d42-original-root-barrier-audit.mjs)" = '284c1b7638f61fc0f195dc8d3237f7c451d50c89'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d41-finite-route-failure-certificate.mjs)" = 'e3f28fd6258badaeb36980e1eb3fc30c8789af8f'
          test "$(git rev-parse HEAD:src/building-pool/roadmap-d/d36-wall-socket-convex-preview.mjs)" = 'b5f96c7b0bf6bd7cae14e7fce85ca05c8fdfb0ba'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check exactly four newly authored source and test modules
        run: |
          node --check src/building-pool/roadmap-d/d43-source-backed-outboard-support.mjs
          node --check src/building-pool/roadmap-d/d43-original-independent-support-audit.mjs
          node --check tests/building-pool/roadmap-d/d43-outboard-support.pure.test.mjs
          node --check tests/building-pool/roadmap-d/d43-original-outboard.source.test.mjs
      - name: Run ONLY D43 four new pure and two authentic original W16/W17 tests
        run: |
          node --test --test-concurrency=1 \
            tests/building-pool/roadmap-d/d43-outboard-support.pure.test.mjs \
            tests/building-pool/roadmap-d/d43-original-outboard.source.test.mjs
