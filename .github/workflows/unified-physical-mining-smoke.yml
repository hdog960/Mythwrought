name: Isolated physical mining package browser smoke
on:
  push:
    branches: [probe/unified-physical-mining-smoke-20261126]
    paths: ['perf/issue-291/physical-mining-package.mjs','perf/issue-291/physical-mining-smoke.mjs','.github/workflows/unified-physical-mining-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: |
          node --check perf/issue-291/physical-mining-package.mjs
          node --check perf/issue-291/physical-mining-smoke.mjs
          node perf/issue-291/physical-mining-package.mjs http://127.0.0.1:4173 artifacts/physical-mining-package
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
          node perf/issue-291/physical-mining-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-mining-smoke
          path: |
            artifacts/physical-mining-smoke/
            artifacts/physical-mining-package/diagnostic-assets.json
          if-no-files-found: warn
