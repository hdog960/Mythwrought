name: Forgotten Sands P0 grounded native footprint
on:
  push:
    branches: [research/forgotten-sands-p0-grounded-footprint-20261123]
    paths:
      - 'src/manual-biomes/forgotten-sands-grounded-probe.mjs'
      - 'tests/forgotten-sands-grounded-probe.test.mjs'
      - '.github/workflows/forgotten-sands-p0-grounded.yml'
permissions:
  contents: read
jobs:
  grounded-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --version
          node --check src/manual-biomes/forgotten-sands-grounded-probe.mjs
          node --check tests/forgotten-sands-grounded-probe.test.mjs
          node --test tests/forgotten-sands-grounded-probe.test.mjs
