name: Roadmap A Wave18 original nonbank source twelve
on:
  push:
    branches:
      - roadmap-a-wave18-original-339-native-ci-r1-20261124
    paths:
      - '.github/workflows/roadmap-a-wave18-original-339-native-ci-r1.yml'
permissions:
  contents: read
jobs:
  exact-authentic-source-wave18-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact source and native test Git blobs
        run: |
          test "$(git rev-parse HEAD:src/building-pool/roadmap-2a/roadmap-a-wave18.mjs)" = "bd2e12ce37cd3fb37993349d0de92b91da200061"
          node --check src/building-pool/roadmap-2a/roadmap-a-wave18.mjs
          test "$(git rev-parse HEAD:tests/building-pool/roadmap-2a/roadmap-a-wave18.test.mjs)" = "cbecfd6c0bbf5ad12b7f4187f3f5025070a99872"
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave18.test.mjs
          test "$(git rev-parse HEAD:src/building-pool/roadmap-2a/roadmap-a-a5-339-provisional.mjs)" = "827d2a110471db017da5f0d3ca865e5681985c37"
          node --check src/building-pool/roadmap-2a/roadmap-a-a5-339-provisional.mjs
          test "$(git rev-parse HEAD:tests/building-pool/roadmap-2a/roadmap-a-a5-339-provisional.test.mjs)" = "8a92a10aca568e344189096d8a7d3cbd1956bb8b"
          node --check tests/building-pool/roadmap-2a/roadmap-a-a5-339-provisional.test.mjs
          test "$(git rev-parse HEAD:tests/building-pool/roadmap-2a/roadmap-a-wave18-protected-128-only-d4.test.mjs)" = "4ca496cf51a156928ac28b106411008bfdfb2a64"
          node --check tests/building-pool/roadmap-2a/roadmap-a-wave18-protected-128-only-d4.test.mjs
      - name: Nine focused original native tests
        run: node --test tests/building-pool/roadmap-2a/roadmap-a-wave18.test.mjs tests/building-pool/roadmap-2a/roadmap-a-a5-339-provisional.test.mjs tests/building-pool/roadmap-2a/roadmap-a-wave18-protected-128-only-d4.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roadmap-a-wave18-339-original-source-provenance-r1
          path: artifacts/roadmap-a-a5/A5_SETTLEMENT_HANDOFF_339_PROVISIONAL.json
          if-no-files-found: error
          retention-days: 14
