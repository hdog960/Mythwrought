name: MYTHWROUGHT Builder D Wave2 true-source WebGL2 acceptance (draft-only)
on:
  pull_request:
    paths:
      - 'src/building-pool/roadmap-d/d1-original-institutions-wave2.mjs'
      - 'tests/building-pool/roadmap-d/d1-original-institutions-wave2*'
      - 'tests/building-pool/roadmap-d/audit-wave2-gallery.mjs'
      - 'tests/roadmap-d-wave2.test.mjs'
      - '.github/workflows/roadmap-d-d2-source-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mythwrought-roadmap-d-wave2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  builder-d-wave2-native-and-real-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require unchanged 153 original 4B sources plus both D waves and strict D4 <0.89
        run: node --test tests/building-pool/roadmap-d/d1-original-institutions-wave2.test.mjs
      - name: Require real Chromium instead of simulated screenshots
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
      - name: Install pinned independent decoder
        run: npm install --no-save --no-audit --no-fund pngjs@7.0.0
      - name: Capture all 36 original Wave2 architecture frames in real software WebGL2
        run: node --test tests/building-pool/roadmap-d/d1-original-institutions-wave2-webgl2.test.mjs
      - name: Fail-closed CRC, PNG pixel, hash, source and cutaway provenance audit
        run: node tests/building-pool/roadmap-d/audit-wave2-gallery.mjs
      - name: Publish source-only evidence (never final material meshes or iPhone approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-d-wave2-36-genuine-webgl2-source-frames
          path: artifacts/building-pool/roadmap-d/d1-original-institutions-wave2-webgl2-cube-proxy/
          if-no-files-found: ignore
