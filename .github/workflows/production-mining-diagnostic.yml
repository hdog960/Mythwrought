name: Mining diagnostic same-install targeted qualification
on:
  push:
    branches: [probe/production-mining-diagnostic-20261126]
    paths: ['src/**','index.html','sw-m5.js','sw-nonblock-stage.js','nonblock-stage-assets.json','tests/**','.github/workflows/production-mining-diagnostic.yml']
permissions:
  contents: read
jobs:
  installed-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2168ac4d38cb1701e49963c7c4ce9f12d3c32cf0
          path: prior-production
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Verify exact source closure, targeted native contracts
        run: |
          node --check src/main.mjs
          node --check src/gpu-recovery.mjs
          node --check src/mining-trace.mjs
          node --check tests/mining-diagnostic-upgrade-browser.mjs
          node scripts/ci/build-stage-cache-manifest.mjs --check
          node --test tests/physical-mining-trace.test.mjs tests/app-update.test.mjs tests/unified-offline-atomic-cache.test.mjs tests/ci/nonblock-cache-manifest.test.mjs
      - name: Real same-origin prior-good rollback, offline upgrade, mining and save reload
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
          DIAGNOSTIC_PREVIOUS_ROOT="$PWD/prior-production" node tests/mining-diagnostic-upgrade-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mining-diagnostic-upgrade
          path: artifacts/mining-diagnostic-upgrade/
          if-no-files-found: warn
