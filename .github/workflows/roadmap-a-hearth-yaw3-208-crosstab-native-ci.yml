name: Roadmap A original hearth/yaw3 all 208 first-face cross-tab exact native
on:
  push:
    branches:
      - roadmap-a-hearth-yaw3-208-crosstab-native-ci-20261123
    paths:
      - '.github/workflows/roadmap-a-hearth-yaw3-208-crosstab-native-ci.yml'
permissions:
  contents: read
jobs:
  original-hearth-cross-tab-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact new source/test syntax only
        run: |
          node --check src/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-face-occlusion-audit.mjs
          node --check src/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-owner-seam-thickness-crosstab.mjs
          node --check tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-owner-seam-thickness-crosstab.test.mjs
      - name: Ten new crosstab cases and eleven directly affected original face-source regressions only
        run: |
          node --test \
            tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-owner-seam-thickness-crosstab.test.mjs \
            tests/building-pool/roadmap-2a/roadmap-a-pack5-hearth-yaw3-face-occlusion-audit.test.mjs
