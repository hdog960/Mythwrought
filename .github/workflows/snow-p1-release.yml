name: Snow P1 persistent candidate targeted release acceptance
on:
  push:
    branches: [release/snow-p1-persistent-candidate-20261124]
    paths:
      - 'src/**'
      - 'index.html'
      - 'styles.css'
      - 'sw-m5.js'
      - 'sw-nonblock-stage.js'
      - 'nonblock-stage-assets.json'
      - 'tests/snow-p1-release.test.mjs'
      - 'scripts/ci/snow-p1-persistent-webgl2.mjs'
      - '.github/workflows/snow-p1-release.yml'
permissions:
  contents: read
jobs:
  persistent-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: 25b40e6375db617e3287521ae59bcece4520b3ee
          path: s18-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact accepted S18 source and release-only delta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C s18-readonly rev-parse HEAD)" = 25b40e6375db617e3287521ae59bcece4520b3ee
          test "$(git hash-object src/manual-biomes/snowy-s17-fresh-source.mjs)" = c04300cc3ad920f3900d76f35cf267393b0ce6a7
          test "$(git hash-object src/manual-biomes/environment-v7.mjs)" = 7a6969a50e00bb490c4b06a13bb236a82fc3789a
          node --check src/main.mjs
          node --check scripts/ci/snow-p1-persistent-webgl2.mjs
          echo 'Material ownership audit: existing render-tag producers excluding the two accepted S18 tag44 files'
          if git -C s18-readonly grep -inE '(vMat[[:space:]]*==[[:space:]]*44([^0-9]|$)|shaderTag[[:space:]]*:[[:space:]]*44([^0-9]|$)|(MATERIAL|RENDER_TAG|ART_TAG)[A-Z_]*[[:space:]]*=[[:space:]]*44([^0-9]|$))' -- src ':!src/voxel.mjs' ':!src/storybook-materials.mjs'; then echo 'Conflicting existing tag producer'; exit 1; fi
      - name: Native registered profile, physical save/reload/export, exact parity and offline hashes
        run: node --test tests/snow-p1-release.test.mjs
      - name: Pinned Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Actual gameplay UI, mining/building, live scenery/mobs and offline reload
        run: |
          python3 -m http.server 4173 >/tmp/snow-p1-release.log 2>&1 &
          node scripts/ci/snow-p1-persistent-webgl2.mjs
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-p1-release-${{ github.sha }}
          path: artifacts/snow-p1-release/
          if-no-files-found: ignore
          retention-days: 7
