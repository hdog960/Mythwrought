name: Isolated current-main hidden sky cost and pixel parity (NO RELEASE)
on:
  push:
    branches:
      - probe/iphone-occluded-sky-291-20261121
permissions:
  contents: read
jobs:
  four-regions-deep-sky-pixel-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject any modified game, shader, safety guard or acceptance sources
        run: |
          test "$(git rev-parse HEAD^)" = "7016e14cd6289f45eaf7fc6a79a362b47996df65"
          git diff --exit-code 7016e14cd6289f45eaf7fc6a79a362b47996df65 HEAD -- src/ index.html styles.css sw-m5.js tests/
          node --check scripts/ci/iphone-occluded-sky-test.mjs
      - name: Install genuine browser and PNG pixel parity reader
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
      - name: Original game unchanged vs test-only sky draw response
        run: |
          python3 -m http.server 4173 --directory . >/tmp/mw-hidden-sky.log 2>&1 &
          node scripts/ci/iphone-occluded-sky-test.mjs
      - name: Preserve all source WebGL2 frames and 192 edits even on mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-current-main-hidden-sky-visual-parity-diagnostic
          path: artifacts/iphone-occluded-sky-probe/
          if-no-files-found: warn
          retention-days: 14
