name: Creative Phase 3 inventory acceptance
on:
  push:
    branches: [creative-phase3-inventory-20261124]
permissions:
  contents: read
jobs:
  creative-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native exact source catalog and geometry
        run: |
          git rev-parse HEAD
          node --check src/main.mjs
          node --test tests/creative-catalog.test.mjs tests/creative-thumbnails.test.mjs
      - name: Browser inventory and original world placement
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
          python3 -m http.server 4173 > /tmp/creative-http.log 2>&1 &
          node tests/creative-integration/phase3-inventory-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-phase3-inventory
          path: artifacts/creative-phase3/
          if-no-files-found: warn
