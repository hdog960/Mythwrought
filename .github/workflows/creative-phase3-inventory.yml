name: Creative Phase 4 outstanding egg acceptance
on:
  push:
    branches: [creative-phase3-inventory-20261124]
permissions:
  contents: read
jobs:
  remaining-real-eggs:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            offset: 0
          - shard: 2
            offset: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --check tests/creative-integration/physical-eggs-browser.mjs
          npm install --no-save --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          npx playwright install chromium
          python3 -m http.server 4174 > /tmp/creative-http.log 2>&1 &
          EGG_SHARD=${{ matrix.shard }} EGG_OFFSET=${{ matrix.offset }} node tests/creative-integration/physical-eggs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-eggs-remaining-${{ matrix.shard }}
          path: artifacts/creative-eggs/
          if-no-files-found: warn
