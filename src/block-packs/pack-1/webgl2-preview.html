<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythwrought Pack 1 — source-exact WebGL2 candidates</title>
<style>
:root{color-scheme:dark;background:#0d1723;color:#eef0e5;font-family:system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;background:#152836}
strong{font-size:15px}small{display:block;font-size:11px;color:#c3d1d1}
.controls{display:flex;gap:7px;align-items:center}
select,button{background:#234252;color:#fff;border:1px solid #7a9396;border-radius:5px;padding:6px}
canvas{display:block;width:100%;height:calc(100dvh - 65px);min-height:170px;object-fit:fill}
#status{position:fixed;bottom:7px;left:8px;max-width:calc(100% - 16px);font:11px monospace;color:#f2e2a3;background:#112331d9;padding:4px 7px;border-radius:5px}
@media(max-width:620px){header{padding:5px 7px}strong{font-size:12px}.controls select{max-width:95px}canvas{height:calc(100dvh - 57px)}}
</style></head>
<body>
<header><div><strong>PACK 1 · TRUE WEBGL2 CANDIDATE</strong><small>Source AABB surfaces + authored per-face art · NOT LIVE GAME</small></div>
<div class="controls"><label for="candidate">ID</label><select id="candidate"></select><button id="rotate" type="button">Rotate</button></div></header>
<canvas id="view" aria-label="Actual candidate geometry rendered by WebGL2"></canvas>
<output id="status" aria-live="polite">Compiling WebGL2 source candidate…</output>
<script type="module" src="./webgl2-preview.mjs"></script>
</body></html>
