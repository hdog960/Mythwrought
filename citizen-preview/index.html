<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythwrought Citizen Preview</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #142021; color: #f4e7d0; }
  body { margin: 0 auto; max-width: 72rem; padding: 1rem; }
  [hidden] { display: none !important; }
  h1 { font-size: clamp(1.35rem, 4vw, 2rem); margin: 0 0 .8rem; }
  a { color:#dbbf89; }
  #controls { display: flex; flex-wrap: wrap; gap: .45rem 1rem; }
  label { display: grid; gap: .25rem; font-size: .875rem; }
  select { font: inherit; max-width: 12rem; border-radius: .375rem; padding: .42rem; }
  canvas { display: block; width: 100%; height: min(54vw, 48vh); min-height: 145px; margin-top: .65rem; background: #283c40; border-radius: .5rem; }
  #names { display: grid; text-align: center; gap: .3rem; color: #ddcaa8; font-size: clamp(.66rem, 1.8vw, .9rem); margin-top: .35rem; }
  #status { margin: .55rem 0 0; color: #b9c9bf; font-size: .85rem; }
</style>
<main>
  <h1>Citizen rig preview</h1>
  <p><a href="./settlement.html">Open test settlement</a></p>
  <div id="controls">
    <label>Profession<select id="profession"></select></label>
    <label id="raceChoice">Race<select id="race"></select></label>
    <label>Biome<select id="biome"></select></label>
    <label id="variantChoice">Appearance<select id="variant"><option>1</option><option>2</option></select></label>
    <label id="ordinaryChoice" hidden>Ordinary appearance<select id="ordinary"></select></label>
    <label>Settlement style<select id="style"></select></label>
    <label>Animation<select id="action"></select></label>
  </div>
  <canvas id="scene" aria-label="3D preview of settlement citizens"></canvas>
  <div id="names"></div>
  <p id="status" role="status"></p>
</main>
<script type="module" src="./preview.mjs"></script>
</html>
