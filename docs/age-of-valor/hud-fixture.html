<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Age of Valor isolated HUD fixture</title><link rel="stylesheet" href="../../src/age-of-valor/hud.css"><style>body{margin:0;background:#172d3c;color:white;font-family:system-ui}#fixture{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#397b91,#284f39)}#world{position:absolute;inset:20% 22%;display:grid;place-items:center;border:2px solid #b59a66;background:linear-gradient(145deg,#7ca566,#344b3c)}#log{position:absolute;left:8px;bottom:8px;max-width:25%;font-size:11px}</style><div id="fixture"><div id="world">ISOLATED WORLD VIEW</div><output id="log">No action</output></div><script type="module">import {createMobileCombatInput} from '../../src/age-of-valor/mobile-controls.mjs';import {layoutCombatRail,projectHudPresentation} from '../../src/age-of-valor/hud-presentation.mjs';import {mountCombatHud} from '../../src/age-of-valor/hud-dom.mjs';const ctx={worldEpoch:1,alive:true,playable:true,landscape:true,creative:false,mounted:false,readOnly:false,overlay:false,graphicsLost:false,combatMode:false};const input=createMobileCombatInput({worldEpoch:1,readContext:()=>ctx});const view=()=>projectHudPresentation({version:1,mode:input.snapshot().mode,bars:{health:{current:84,max:100,fraction:.84},stamina:{current:62000,max:100000,fraction:.62},mana:{current:91000,max:100000,fraction:.91}},target:null,effects:[],cooldowns:[]});const ui=mountCombatHud({root:document.querySelector('#fixture'),input,readPresentation:view,emit:e=>{document.querySelector('#log').textContent=e.kind;if(e.kind==='mode-request'){ctx.combatMode=e.mode==='combat';queueMicrotask(()=>{ui.acknowledgeMode(e.mode,e.generation);ui.render()})}},readZoneOptions:z=>z==='dodge'?{direction:[1,0]}:z==='ability'?{abilityId:'fixture:spell'}:{},now:()=>performance.now(),layout:layoutCombatRail({width:innerWidth,height:innerHeight}),hostWindow:window,hostDocument:document});ui.render();</script></html>
